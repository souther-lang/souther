name: Release

# Builds the release artifacts on a `v*` tag and attaches them to the matching GitHub Release.
# The VS Code extension (souther-lang/souther-vscode) fetches souther-lsp.jar and
# souther.tmLanguage.json from here, so it can be packaged without building the compiler.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Nothing else runs on Windows, so a change to what is packaged there would otherwise first be
  # run at release time. The job below that packages runs on such a change; the one that publishes
  # has nothing to publish and does not.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'bin/package-windows.ps1'
      - 'install.ps1'
      - 'souther-cli/src/main/launcher/**'

# Writing is the publishing job's alone, and it asks for it there. A job that builds from a pull
# request's own code runs with a token that can only read.
permissions:
  contents: read

jobs:
  # jpackage builds an image for the platform it runs on, so the Windows distributions are built on
  # a Windows runner and handed to the job that publishes. The tests are the CI workflow's and the
  # publishing job's; what this job checks is that the images it wrote run.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package the distributions
        run: |
          mvn -B --no-transfer-progress -DskipTests package
          bin/package-windows.ps1

      # Both launchers, over the commands that need most of the runtime the image was built with: a
      # compile writes bytecode, and `japi` reads javadoc out of a library's sources through a
      # compiler. A module the image was built short of is answered for here and nowhere earlier,
      # because nothing before this point runs on Windows at all.
      - name: Run what was packaged
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'souther-cli/target/dist'
          Expand-Archive (Get-ChildItem "$dist/*-windows-x64.zip").FullName -DestinationPath "$dist/bundled-run"
          Expand-Archive (Get-ChildItem "$dist/*-windows-x64-nojre.zip").FullName -DestinationPath "$dist/nojre-run"
          $model = 'souther-test-support/src/main/resources/souther/corpus/catalog/catalog.sou'
          $launchers = @("$dist/bundled-run/souther/souther.exe", "$dist/nojre-run/souther/souther.cmd")
          foreach ($souther in $launchers) {
              & $souther compile $model -d "$dist/classes"
              if ($LASTEXITCODE -ne 0) { throw "$souther could not compile $model" }
              & $souther japi net.unit8.raoh.Result > $null
              if ($LASTEXITCODE -ne 0) { throw "$souther could not read a library's javadoc" }
          }

      # The installer writes the user's path, points a link and removes a directory recursively, and
      # nothing else in this repository does any of that. It is run against the archives just
      # packaged rather than a release, so what is checked is this commit's installer rather than the
      # last one published — and an entry of the user's own is put on the path first, because what
      # the installer must not do is as much of the subject as what it must.
      - name: Install what was packaged, and uninstall it
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "$PWD/souther-cli/target/dist"
          Get-ChildItem "$dist/*.zip" | ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content "$dist/SHA256SUMS"
          $version = (Get-ChildItem "$dist/*-windows-x64.zip").BaseName -replace '^souther-' -replace '-windows-x64$'

          $control = 'C:\an-entry-of-the-users-own'
          [Environment]::SetEnvironmentVariable('Path', $control, 'User')
          function Get-Entries {
              @(([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Where-Object { $_ })
          }

          $owned = Join-Path $env:LOCALAPPDATA 'Programs\souther'
          $link = Join-Path $owned 'current'

          # Both distributions, second over first, so what is checked is an install and then an
          # install onto one already there.
          foreach ($nojre in @($true, $false)) {
              ./install.ps1 -Version $version -From $dist -Nojre:$nojre
              $launcher = @(Get-ChildItem "$link/souther.exe", "$link/souther.cmd" -ErrorAction SilentlyContinue)[0]
              if (-not $launcher) { throw "no launcher under $link after installing (nojre=$nojre)" }
              & $launcher.FullName help > $null
              if ($LASTEXITCODE -ne 0) { throw "the installed launcher could not answer (nojre=$nojre)" }
              $entries = Get-Entries
              if (@($entries | Where-Object { $_ -eq $link }).Count -ne 1) {
                  throw "PATH holds $link other than once: $($entries -join ';')"
              }
              if ($entries -notcontains $control) { throw "the installer took $control off PATH" }
          }

          ./install.ps1 -Uninstall
          if (Test-Path $owned) { throw "$owned is still there after an uninstall" }
          $entries = Get-Entries
          if ($entries -contains $link) { throw "PATH still holds $link after an uninstall" }
          if ($entries -notcontains $control) { throw "the uninstall took $control off PATH" }

      - name: Upload the distributions to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: souther-windows
          path: souther-cli/target/dist/*.zip

  release:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # The CLI's really-executable launcher and the shaded language server are build outputs of the
      # reactor; the grammar is a committed resource that `verify` has just checked is not stale.
      # The server is shaded under a final name of its own so the plain jar stays the module's
      # artifact and the one `souther-cli` depends on, and is published here under the name an
      # editor downloads it by.
      - name: Collect the artifacts
        run: |
          mkdir -p artifacts
          cp souther-cli/target/souther artifacts/
          cp souther-cli/target/souther.jar artifacts/
          cp souther-lsp/target/souther-lsp-all.jar artifacts/souther-lsp.jar
          cp souther-compiler/src/main/resources/souther/compiler/highlight/souther.tmLanguage.json artifacts/

      # The Windows distributions are built on a runner of their own, and the checksums below cover
      # whatever this directory holds, so they are fetched into it before those are written.
      - name: Collect the Windows distributions
        uses: actions/download-artifact@v7
        with:
          name: souther-windows
          path: artifacts/

      # Over whatever the steps above collected, rather than a second list of the same names, and
      # under the names the release publishes, so `sha256sum -c SHA256SUMS` works in a directory the
      # assets were downloaded into. The file is written outside artifacts/ and moved in, so it
      # cannot turn up in its own listing.
      - name: Checksum the artifacts
        run: |
          sha256sum artifacts/* | sed 's#artifacts/##' > SHA256SUMS
          mv SHA256SUMS artifacts/

      - name: Upload the artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: souther-release
          path: artifacts/*

      - name: Attach the artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # A tag carrying a pre-release identifier is not what a reader arriving at the repository
          # should be handed as the current release. Semantic versioning puts that identifier after a
          # hyphen and a final version has none, so the tag answers this itself and nothing has to be
          # remembered at release time.
          prerelease: ${{ contains(github.ref_name, '-') }}

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    # Nightly, and the only thing that asks what is too slow to wait on.
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  # What a pull request and a push wait on: everything except the tests written `@Nightly`. A test
  # is left out only where its class says both that no cheaper way to ask the same question was
  # found and that what it finds is as well found by the morning as by the change that caused it.
  # Those are the job below, and nobody waits on them. A closed-world contract is here unless its
  # class says that: what it finds is found against the tree it was written for, and a contract
  # deferred is found against one that has moved.
  #
  # Not on a schedule: the job below runs everything this one runs and the slow tests besides, so
  # the two together would build the reactor twice over and answer the same question the second
  # time.
  #
  # The compiler's tests are most of the wait, so they are spread over two runners and every other
  # module's tests are on a third. Each runner builds what it needs and runs only the tests its
  # filter names. The filters are exhaustive by construction: `rest` is everything outside the
  # compiler's test package, `compiler-a` is the packages listed, and `compiler-b` is the
  # compiler's package less those. A test class added anywhere lands in exactly one of the three,
  # and a package added under the compiler lands in `compiler-b`. Naming tests replaces the
  # classes surefire takes by default, so `rest` leaves out `*IT` again: those run after
  # packaging, in failsafe, which the filter does not reach.
  build:
    if: github.event_name != 'schedule'
    name: build (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: rest
            modules: ''
            tests: '!souther/compiler/**,!**/*IT'
          - name: compiler-a
            modules: '-pl souther-compiler -am'
            tests: 'souther/compiler/partition/**,souther/compiler/check/**,souther/compiler/doc/**,souther/compiler/fmt/**,souther/compiler/inputs/**,souther/compiler/query/**,souther/compiler/values/**'
          - name: compiler-b
            modules: '-pl souther-compiler -am'
            tests: 'souther/compiler/**,!souther/compiler/partition/**,!souther/compiler/check/**,!souther/compiler/doc/**,!souther/compiler/fmt/**,!souther/compiler/inputs/**,!souther/compiler/query/**,!souther/compiler/values/**'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        # As many as the runner has, and printed so that a run says how many it was given. The
        # number in the pom is a ceiling for a machine somebody is also working on, and a runner
        # is nobody's. A module a filter matches nothing in runs no tests rather than failing.
        # Naming tests in the pom empties the tag left out, so the tag is named here again.
        run: |
          echo "forks: $(nproc)"
          mvn -B --no-transfer-progress verify ${{ matrix.shard.modules }} \
            -DforkCount=$(nproc) \
            -Dtest.excluded.groups=nightly \
            -Dsurefire.failIfNoSpecifiedTests=false \
            '-Dtest=${{ matrix.shard.tests }}'

  # develop's snapshot, published from a push to develop once every shard above has passed, and
  # from nowhere else: the snapshot coordinate is overwritten by each publication, and this is what
  # makes it the last develop that passed.
  #
  # Which run's job is right is the `snapshot` profile's to decide, not the order jobs run in: a
  # job reaches the group when its own shards finish, which is not the order the pushes came in,
  # and GitHub does not promise an order among those waiting. The profile publishes only the tip
  # of develop, so a job for an older commit stops before publishing whenever it runs. What the
  # group has to give is two things. One publication at a time, so the tip's job, waiting behind
  # an older one already past the check, publishes after it. And no waiting job dropped: by
  # default a job arriving cancels the one already waiting, so an older commit's job finishing its
  # shards late would cancel the tip's and then stop itself, and nothing would publish the tip.
  # `queue: max` keeps every waiting job, up to a hundred.
  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-snapshot
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
      - name: Publish develop's snapshot
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          code=0
          bin/require-develop-tip.sh || code=$?
          if [ "$code" -eq 3 ]; then
            echo "develop has moved past $GITHUB_SHA; the run for where it is now publishes."
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          mvn -B --no-transfer-progress -Psnapshot -DskipTests deploy

  # And the slow ones, asked where waiting for them costs nobody an edit: once a night, and nowhere
  # a change is on its way in. Emptying the property is what asks them; everything the job above
  # runs is run here too, so this is the whole suite and not the remainder of it.
  #
  # A scheduled run is made against the default branch and no other, so the branches a day's work
  # lands on are named here and checked out by name. What a merge into `develop` left behind is
  # found by the morning, and against the commit the day ended on rather than the one that broke
  # it.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ develop, main ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test ${{ matrix.branch }}, the slow tests included
        run: |
          echo "forks: $(nproc)"
          mvn -B --no-transfer-progress verify -DforkCount=$(nproc) -Dtest.excluded.groups=

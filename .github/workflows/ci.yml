name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    # Nightly, and the only thing that asks what is too slow to wait on.
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  # What a pull request and a push wait on: everything except the tests written `@Nightly`. A test
  # is left out only where its class says both that no cheaper way to ask the same question was
  # found and that what it finds is as well found by the morning as by the change that caused it.
  # Those are the job below, and nobody waits on them. A closed-world contract is here unless its
  # class says that: what it finds is found against the tree it was written for, and a contract
  # deferred is found against one that has moved.
  #
  # Not on a schedule: the job below runs everything this one runs and the slow tests besides, so
  # the two together would build the reactor twice over and answer the same question the second
  # time.
  #
  # The compiler's tests are most of the wait, so they are spread over two runners and every other
  # module's tests are on a third. Each runner builds what it needs and runs only the tests its
  # filter names. The filters are exhaustive by construction: `rest` is everything outside the
  # compiler's test package, `compiler-a` is the packages listed, and `compiler-b` is the
  # compiler's package less those. A test class added anywhere lands in exactly one of the three,
  # and a package added under the compiler lands in `compiler-b`. Naming tests replaces the
  # classes surefire takes by default, so `rest` leaves out `*IT` again: those run after
  # packaging, in failsafe, which the filter does not reach.
  #
  # The packages in `compiler-a` are chosen for the time their tests take, so that the two
  # compiler runners finish together: the compiler's own package is the largest share and cannot
  # be split by package, so it is in `compiler-b` with the small ones, and the rest are here.
  #
  # The tests that read the repository's models are a fourth runner of their own, and the other
  # two compiler runners leave them out by their tag. Reading the models costs compiling them, once
  # for a JVM; spread over the forks of the runners above, every fork one of them reached first
  # compiled them again. Here they are one fork, and the models are compiled once. Which tests
  # carry the tag is read off what they reach, so a test added among them lands here.
  #
  # Error Prone is not run here. The `lint` profile is on wherever `CI` is set, which every runner
  # is, and it reads the whole reactor at every compile — the same findings three times over, in
  # the time each runner spends before its first test. The `lint` job below asks it once, beside
  # these, and a change waits on it as on them.
  build:
    if: github.event_name != 'schedule'
    name: build (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: rest
            modules: ''
            tests: '!souther/compiler/**,!**/*IT'
            tags: '-Dtest.excluded.groups=nightly'
            forks: '$(nproc)'
          - name: compiler-a
            modules: '-pl souther-compiler -am'
            tests: 'souther/compiler/partition/**,souther/compiler/check/**,souther/compiler/doc/**,souther/compiler/inputs/**,souther/compiler/report/**,souther/compiler/meta/**'
            tags: '-Dtest.excluded.groups=nightly,repository-models'
            forks: '$(nproc)'
          - name: compiler-b
            modules: '-pl souther-compiler -am'
            tests: 'souther/compiler/**,!souther/compiler/partition/**,!souther/compiler/check/**,!souther/compiler/doc/**,!souther/compiler/inputs/**,!souther/compiler/report/**,!souther/compiler/meta/**'
            tags: '-Dtest.excluded.groups=nightly,repository-models'
            forks: '$(nproc)'
          - name: compiler-models
            modules: '-pl souther-compiler -am'
            tests: 'souther/compiler/**'
            tags: '-Dgroups=repository-models -Dtest.excluded.groups=nightly'
            forks: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        # As many as the runner has, and printed so that a run says how many it was given. The
        # number in the pom is a ceiling for a machine somebody is also working on, and a runner
        # is nobody's, except where a runner is kept to one fork. A module a filter matches nothing
        # in runs no tests rather than failing. Naming tests in the pom empties the tag left out, so
        # the tags are named here again.
        run: |
          echo "forks: ${{ matrix.shard.forks }}"
          mvn -B --no-transfer-progress verify ${{ matrix.shard.modules }} \
            -P '!lint' \
            -DforkCount=${{ matrix.shard.forks }} \
            ${{ matrix.shard.tags }} \
            -Dsurefire.failIfNoSpecifiedTests=false \
            '-Dtest=${{ matrix.shard.tests }}'

  # Error Prone over every module's sources and tests, once. It runs no test: what it finds is in
  # the code as written, and the runners above build the same code without it.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile with Error Prone
        run: mvn -B --no-transfer-progress test-compile

  # And the slow ones, asked where waiting for them costs nobody an edit: once a night, and nowhere
  # a change is on its way in. Emptying the property is what asks them; everything the job above
  # runs is run here too, so this is the whole suite and not the remainder of it.
  #
  # A scheduled run is made against the default branch and no other, so the branches a day's work
  # lands on are named here and checked out by name. What a merge into `develop` left behind is
  # found by the morning, and against the commit the day ended on rather than the one that broke
  # it.
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ develop, main ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test ${{ matrix.branch }}, the slow tests included
        run: |
          echo "forks: $(nproc)"
          mvn -B --no-transfer-progress verify -DforkCount=$(nproc) -Dtest.excluded.groups=

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Which strings 199x-notation accepts is a rule of the specification, so a version of it is
    # taken by hand with the change to the language it makes, never by an update.
    ignore:
      - dependency-name: "net.unit8.199x:*"
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.sonatype.central:*"
      maven-test-dependencies:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "org.apache.maven.plugins:*"
          - "org.sonatype.central:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

data.supply-the-field-explicitly=`{field}` を明示的に与えてください。スプレッドはそれを提供しません。
data.the-field-is-not-in-what-the-sum-shares=`{field}` は `{sum}` の全ケースがスプレッドしている共通部分にないので、スプレッドはそれを提供しません。明示的に与えるか、`{sum}` を `match` で開いて、それを持つケースから読んでください。
data.the-field-is-in-the-shared-part-of-none-of-these=直和のスプレッドは、全ケースがスプレッドしている共通部分を提供します。`{field}` は次のいずれの共通部分にもありません: {sums}。明示的に与えるか、それを持つケースのある直和を `match` で開いてください。


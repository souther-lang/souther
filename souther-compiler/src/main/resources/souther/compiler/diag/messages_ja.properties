# --- `souther examples --generate` が書くテストケースのまわりのコメント ---
generated-rows.one-row-generated=`souther examples --generate` が生成: 何もカバーしていないところを埋めるテストケース 1 件。
generated-rows.rows-generated=`souther examples --generate` が生成: 何もカバーしていないところを埋めるテストケース {count} 件。
generated-rows.generated-by=`souther examples --generate` が生成:
generated-rows.one-row-to-fill=何もカバーしていないところを埋めるテストケース 1 件。
generated-rows.rows-to-fill=何もカバーしていないところを埋めるテストケース {count} 件。
generated-rows.one-optional-row=呼び出す behavior の example の入力を試す、任意のテストケース 1 件。未カバーのカバレッジアイテムには対応しない。
generated-rows.optional-rows=呼び出す behavior の example の入力を試す、任意のテストケース {count} 件。未カバーのカバレッジアイテムには対応しない。
generated-rows.replace-each-unanswered=各 `{unanswered}` を、システムが実際に返す答えに書き換える。
generated-rows.ensures-written-for=`{behavior}` に書かれた `ensures`:
generated-rows.suggested-input=入力の提案。未カバーのカバレッジアイテムはない

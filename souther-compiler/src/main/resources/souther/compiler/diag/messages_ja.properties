example.a-fake-had-no-output-for-an-input=fake が入力に対する出力を持っていません: {input}
example.a-row-does-not-keep-what-the-behavior-states=この行に書かれた値は、`{target}` の `ensures` に反しています: {why}
example.a-fake-row-does-not-keep-what-the-dependency-states=この fake の行が返す値は、`{dependency}` の `ensures` に反しています: {why}
example.an-implementation-does-not-keep-what-the-behavior-states=`{target}` に与えられた実装がこの行の入力に対して返した値は、`{target}` の `ensures` に反しています: {why}
example.the-declaration-is-what-says-what-it-answers=`{target}` が何を返しうるかは `ensures` が決めているので、それに反する行は起こらないことを書いています。値が間違っているか、`ensures` が間違っているかのどちらかです。
example.the-answer-is-of-another-build=`{target}` の実装は `{module}` の別のリビジョンに対してビルドされていて、そちらでは `{declaration}` の宣言が異なります。
example.build-what-answers-it-against-this-revision=実装を `{module}` の今のリビジョンに対してビルドし直すか、実装をビルドしたときのリビジョンに対してこのモデルをコンパイルしてください。
example.build-what-answers-it-against-a-path-that-carries=`{module}` を含むクラスパスで、実装をビルドし直してください。
example.whether-the-answer-is-of-this-module-cannot-be-told=`{target}` の実装が `{module}` に対してビルドされたかどうかを判断できません。
example.its-classes-carry-no-declarations=`{module}` のクラスには宣言が含まれていません。
example.what-it-published-cannot-be-read-here=`{module}` が公開した宣言をこのコンパイラは読めません。
example.it-did-not-say-which-build-it-reads-by=実装が、行の値をどのビルドの `{module}` で読むのかを示していません。
example.this-compile-cannot-read-its-own-declarations-of=このコンパイル側の `{module}` の宣言を読めないため、実装の結果と比べられませんでした。
example.the-row-and-the-fake-disagree=この行と `fake {behavior}` の行が、同じ入力に対して違う結果を書いています。
example.what-the-row-says-and-what-the-fake-says=行は {row}、fake は {fake} です。
example.the-fake-row-is-here=`fake {behavior}` の行
example.the-row-and-the-with-disagree=この行と `with {behavior}` が、同じ入力に対して違う結果を書いています。
example.what-the-row-says-and-what-the-with-says=行は {row}、`with` は {with} です。
example.the-with-is-here=`with {behavior}`

# --- souther run（コマンドラインが behavior を1つ駆動する。コンパイルエラーではない） ---
run.usage.line=使い方: souther run <file.sou> [-cp <パス>] [--behavior <名前>] [--input <json>]
run.usage.singlefile=run が取る .sou ファイルは1つです。
run.usage.nofile=ソースファイルが指定されていません。
run.usage.optionvalue=`{0}` には値が必要です。
run.behavior.none=このモジュールには `run` で動かせる behavior がありません。動かせるのは、Souther 側に実装があって注入を必要とせず（`>->` なら全ステージがそうであり）、かつモジュールが exposing で公開している behavior です。
run.behavior.several=`run` で動かせる behavior が複数あります。--behavior で1つ選んでください: {0}
run.behavior.runnable=`{0}` は実行できます。`run` で動かせる behavior: {1}
run.behavior.noimpl=`{0}` には実装がありません（Java から注入されます）。`run` で動かせる behavior: {1}
run.behavior.unwritten=`{0}` は依存するものを宣言していて `let` がまだ無いので、動かすものがありません。`run` で動かせる behavior: {1}
run.behavior.depends=`{0}` は注入依存（{1}）を必要とし、`run` はそれを供給できません。`run` で動かせる behavior: {2}
run.behavior.unknown=`{0}` という behavior はありません。`run` で動かせる behavior: {1}
run.behavior.notexposed=`{0}` は公開されていません。`run` が動かすのはモジュールが公開している behavior です。`exposing` に追加してください。`run` で動かせる behavior: {1}
run.behavior.failed=`{0}` が失敗しました: {1}
run.behavior.unreachable=`{0}` を起動できませんでした。生成された `{1}` を読み込めません: {2}。これはモジュールではなくコンパイラ側の欠陥です。
run.pipeline.noimpl=`{0}` はパイプラインで、ステージ `{1}` に実装がありません（Java から注入されます）。`run` はそれを供給できません。`run` で動かせる behavior: {2}
run.pipeline.depends=`{0}` はパイプラインで、ステージ `{1}` が注入依存（{2}）を必要とします。`run` はそれを供給できません。`run` で動かせる behavior: {3}
run.input.missing=`{0}` は入力を {1} 個取ります。--input を渡してください。
run.input.notarray=`{0}` は入力を {1} 個取ります。--input はその長さの JSON 配列にしてください。
run.input.count=`{0}` は入力を {1} 個取りますが、--input には {2} 個あります。
run.input.wrapped=この behavior のパラメータは1つです。--input には値を直接指定し、外側の配列を取り除いてください。
run.input.badjson=--input が正しい JSON ではありません: {0}
run.input.toodeep=--input はこの境界が受け取れる深さを超えています: {0} 以下（JSON の入れ子が {1} レベルを超えました）。data の1レベルが JSON の複数レベルを使うことがあります。
run.decode.failed=入力 #{0} をデコードできませんでした — {1}
run.encode.toodeep=出力が深く入れ子になりすぎていて、この境界ではエンコードできません。
run.read.failed={0} を読めません: {1}
run.output.json=出力を JSON にできませんでした: {0}
run.output.toodeep=出力はこの境界が書き出せる深さを超えています: {0} 以下（JSON の入れ子が {1} レベルを超えました）。data の1レベルが JSON の複数レベルを使うことがあります。
run.decode.malformed=入力 #{0} は `{1}` の形になっていません。--input を確認してください。

# behavior が自分に到達する（E1608）
declaration.a-behavior-reaches-itself=`behavior {behavior}` から自分自身に戻る経路があります: {through}。
declaration.a-behavior-does-not-recurse=behavior は呼び出し・`depends on`・`>->` の stage のいずれでも再帰しません。再帰はヘルパ `let` として書いてください。そこでは全域性が証明されます。


# --- attempted construction (E2012, `if T(v) as x` / `guard T(v) as x`) ---
check.attempt.title=試みられない構築
attempt.this-is-not-a-construction=`as` は構築した値に名前を付けるものですが、これは構築ではありません。
attempt.write-the-construction-whose-invariant-decides=分岐を決める invariant を持つ構築を書くか、`as` をやめて条件を書いてください。
attempt.the-type-declares-no-invariant=`{data}` は invariant を宣言していないため、`as` を付けて構築しても必ず成功し、`else` の値は使われません。
attempt.construct-it-directly-or-give-it-an-invariant=`{data}` をそのまま構築するか、分岐を決める invariant を与えてください。
attempt.nothing-here-is-attempted=これらの腕は invariant の句ごとの失敗を扱うものですが、条件が `as <名前>` の付いた構築ではないので、扱う失敗がありません。
attempt.attempt-the-construction-or-give-the-else-one-value=条件を `as x` の付いた構築にする（`guard T(v) as x else ...` か `if T(v) as x then ... else ...`）か、`else` に値をひとつだけ書いてください。
attempt.the-clause-is-answered-twice=句 `{clause}` の腕が二つあります。腕は失敗した句で選ばれるので、二つ目の腕には入りません。
attempt.no-clause-of-that-name=`{data}` に `{clause}` という名前の invariant の句はありません。
attempt.the-clauses-that-can-be-answered=名前で書ける句は {clauses} です。句の名前は宣言側で付けます（`invariant <名前> = ...`）。名前のない句は `| _ -> ...` で扱います。
attempt.these-clauses-have-no-arm=`{data}` の次の句に腕がありません: {clauses}。構築が失敗すると、失敗した句の腕に入るので、失敗しうる句にはすべて腕が必要です。
attempt.answer-each-of-them-or-give-the-else-one-value=それぞれに腕を書くか、`else` に値をひとつだけ書いてください。値がひとつなら、どの句が失敗してもその値を使います。
attempt.unnamed-clauses-are-left-unanswered=`{data}` には名前のない invariant の句があり、それを扱う腕がありません。
attempt.add-a-catch-all-arm-or-name-them=`| _ -> ...` を足すか、宣言側で名前を付けてください。
attempt.the-catch-all-arm-answers-nothing=`{data}` の invariant の句はすべて名前があり、それぞれ腕があるので、`| _ -> ...` には入りません。
attempt.drop-the-catch-all-arm=削除してください。`{data}` が名前のない句を宣言したら、また必要になります。

# 値の循環
check.value.cycle.title=値の循環
name.a-value-reaches-itself=`let {name}` が自分自身を通じて定義されています（{through}）。値は使われる位置でその定義に置き換えられるので、自分自身を通じて定義された値には置き換える定義がありません。ヘルパが再帰できるのはメソッドにコンパイルされるからで、値はそうなりません。
module.an-exposed-value-rests-on-what-is-kept=`{exposed}` は公開されていますが、それが指す `{stands}` は公開されていません。
module.an-exposed-argument-rests-on-what-is-kept=`{exposed}` は公開されていますが、引数 `{argument}` の型 `{type}` は公開されていません。
module.a-carried-helper-builds-what-is-kept=`{helper}` は公開されたヘルパと一緒にコピーされ、その helper を import した各モジュールで本体が実行されます。その本体が、このモジュールが公開していない `{kept}` を使っています。
module.a-published-helper-builds-what-is-kept=`{helper}` は公開されており、本体は import した各モジュールで実行されます。その本体が、このモジュールが公開していない `{kept}` を使っています。

# --- JVM が保持できる大きさ (E2101, E2102, E2103) ---
e2101.title=生成メソッドが JVM の引数スロット上限を超える
declaration.a-data-needs-more-slots-than-a-constructor-holds=`data {data}` は JVM の引数スロットを {needs} 必要としますが、生成されるコンストラクタが取れるのは最大 {holds} です。`Int` のフィールドは `long` として格納されるので2スロット、それ以外のフィールドは1スロットです。
declaration.split-the-data-and-hold-them-as-fields=`{data}` を小さな data に分割し、フィールドとして持たせてください。
declaration.a-behavior-takes-more-parameters-than-apply-holds=`behavior {behavior}` は引数を {takes} 取りますが、生成される `apply` メソッドが取れるのは最大 {holds} です。
declaration.group-the-parameters-into-a-data=引数を data にまとめ、それを取るようにしてください。
declaration.a-behavior-has-more-dependencies-than-a-constructor-holds=`behavior {behavior}` は依存を {has} 受け取って組み立てられますが、生成されるコンストラクタが取れるのは最大 {holds} です。
declaration.group-the-dependencies-behind-a-behavior=依存をまとめる behavior を用意し、そちらに依存してください。
declaration.a-helper-takes-more-parameters-than-a-method-holds=`let {helper}` は引数を {takes} 取りますが、生成されるメソッドが取れるのは最大 {holds} です。
e2102.title=生成メソッドが JVM のコードサイズ上限を超える
declaration.a-method-is-larger-than-the-jvm-holds=`{owner}` に対して生成される `{method}` メソッドはコードが {bytes} バイトですが、JVM のメソッドが保持できるのは最大 {holds} バイトです。
declaration.split-the-work-or-move-the-table=処理を別の behavior に分けてください。別クラスとして生成されます。あるいは表データをソースの外に移してください。
declaration.naming-parts-does-not-divide-the-method=`let` で名前を付けても分割にはなりません。非再帰の helper は呼び出しごとに inline されるので、そちらに移しても同じコードがここに残ります。value は名前を読む region ごとに一度だけ作られるので、この body が二度以上書き出しているものに名前を付ければ重複は消えますが、残ったものはこのメソッドのままです。
e2103.title=生成クラスが JVM の定数プール上限を超える
e2104.title=ソースが深すぎる
e2108.title=コンパイラが処理しきれなかった
declaration.the-compiler-ran-out-of-room=処理の途中で足りなくなりました。ソースの入れ子の深さも定義が持てる構造の量もそれぞれ上限があり、超えたものは場所を示して拒否されます。つまりこれはソースについての報告ではありません。このコンパイラがサポートするスタック上では、受理したソースから作られるものがここまで深くなることはないはずです。与えられたスタックがそれより小さいか、上限がまだ押さえられていない形かのどちらかです。
e2107.title=定義がコンパイラの保持できる複雑さを超える
declaration.a-block-takes-more-structural-steps-than-a-definition-holds=このブロックは {steps} 段の構造を進みますが、1つの定義が保持できるのは最大 {holds} 段です。ある文より後はすべてその文が導入したものの内側に書かれるため、1段ずつ増えます。`guard` は名前を束縛しませんが、同じく1段です。
declaration.a-definition-is-more-structure-than-is-held=`let {definition}` は構造が {costs} 段ですが、1つの定義が保持できるのは最大 {holds} 段です。
declaration.substituting-a-value-is-more-structure-than-is-held=ここで `{value}` を代入すると、1つの定義が保持できる {holds} 段を超えます。値は名前が書かれた場所に代入されるので、その値の分が名前を書いた側に加わります。
declaration.write-it-as-a-behavior-of-its-own=最も多くを言っている部分を独立した behavior として書いてください。behavior はそれ自体が1つの定義で、別に数えられます。`let` で名前を付けても減りません。ブロックの文も値の代入も、どちらも数えられます。
declaration.a-class-refers-past-the-constant-pool=`{owner}` に対して生成されるクラスは定数プールのエントリ {refersTo} を参照しますが、クラスファイルが指せるのは最大 {holds} です。プールにはクラスが参照する名前・型・リテラルがすべて入ります。
declaration.a-class-needs-more-constants-than-it-holds=`{owner}` に対して生成されるクラスは定数プールのエントリを {needs} 必要としますが、クラスファイルが保持できるのは最大 {holds} です。プールにはクラスが参照する名前・型・リテラルがすべて入ります。
declaration.move-the-table-out-of-the-source=表データをソースの外に移すか、処理を別の behavior に分けてください。定数は別クラスのものになります。
declaration.a-class-holds-a-text-longer-than-a-constant=`{owner}` に対して生成されるクラスは {holds} バイトより長いテキストを持ちますが、クラスファイルの定数1つにはそれ以上入りません。文字列リテラルは定数1つです。宣言のソースも、読む側のモジュールのためにまるごと埋め込まれるので定数1つです。
declaration.shorten-the-text-or-split-what-is-written=長いテキストはソースの外に移してください。長い宣言は小さな宣言に、長い `exposing` はモジュールを分けて短くしてください。
e2109.title=パターンの機械が生成クラスに収まる大きさを超える
declaration.a-patterns-machine-is-written-in-more-than-a-class-holds=パターン `{pattern}` は、生成クラスに書き込んだ機械として実行されます。書き出した文字数は、1つのパターンにクラスが割り当てる最大の {most} 文字を超えます。
declaration.write-the-repetitions-of-a-pattern-smaller=繰り返しは、繰り返す部分を大きい方の回数だけ書き出したものとして数えます。繰り返しの中の繰り返しは、2つの回数を掛けた数になります。回数を小さく書くか、長さの条件を `String.length` でパターンとは別に書いてください。
e2110.title=パターンが上限を超える

example.the-table-spent-its-steps=`fake {fake}` のテーブルの構築が {budget} ステップの予算を使い切ったので、テーブルの内容は何も検査されていません。
example.the-table-goes-round-too-many-times=テーブルの行が、example で許される回数より多くループするヘルパを適用しています。ループの回数を制限するか、行が構築する値を小さくしてください。それまで、`fake {fake}` のテーブルが構築できるかどうかは分かりません。
example.the-table-reached-its-depth-limit=`fake {fake}` のテーブルの構築が再帰深度の上限 {limit} に達したので、テーブルの内容は何も検査されていません。
example.the-table-recurses-too-deeply=テーブルが適用するヘルパが、example で許される深さを超えて再帰しています。引数の一部に対して再帰するように書き換えるか、行が構築する値を小さくしてください。それまで、`fake {fake}` のテーブルが構築できるかどうかは分かりません。
example.the-table-did-not-answer=`fake {fake}` のテーブルの構築が {within}ms 以内に終わらなかったので、テーブルの内容は何も検査されていません。
example.the-table-not-answering-is-not-the-table-being-wrong=`fake {fake}` のテーブルが間違っているという意味ではありません。時間切れになったのはコンパイラ自身の処理で、ステップ数と再帰深度の上限はこの処理を数えていません。
example.not-compared-the-table-spent-its-steps=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が {budget} ステップの予算を使い切りました。
example.the-table-compared-goes-round-too-many-times=テーブルの行が、example で許される回数より多くループするヘルパを適用しています。ループの回数を制限するか、行が構築する値を小さくしてください。それまで、この fake と `example {behavior}` の行が一致するかは分かりません。
example.not-compared-the-table-reached-its-depth-limit=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が再帰深度の上限 {limit} に達しました。
example.the-table-compared-recurses-too-deeply=テーブルが適用するヘルパが、example で許される深さを超えて再帰しています。引数の一部に対して再帰するように書き換えるか、行が構築する値を小さくしてください。それまで、この fake と `example {behavior}` の行が一致するかは分かりません。
example.not-compared-the-table-did-not-answer=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が {within}ms 以内に終わりませんでした。
example.not-answering-is-not-two-answers=fake と `example {behavior}` の行が食い違っているという意味ではありません。時間切れになったのはコンパイラ自身の処理で、ステップ数と再帰深度の上限はこの処理を数えていません。

example.the-evaluation-did-not-answer=この行の評価が {within}ms 以内に終わらなかったので、打ち切りました。
example.not-answering-is-not-not-terminating=モデルが停止しないという意味でも、この行が間違っているという意味でもありません。コンパイラが時間内に判定できなかったということです。この時間制限が対象にするのはコンパイラ自身の処理（クラスの読み込み、値の復号、jar からのモジュールの読み込み）で、Java から与えた実装にかかる時間は含みません。
example.the-stack-ran-out-before-the-depth-limit=この行の評価が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切りました（{stack}）。
example.the-depth-limit-is-what-should-stop-it=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、ヘルパを末尾再帰に書き換えてフレームを積まないようにしてください。

example.the-table-ran-out-of-stack=`fake {fake}` のテーブルの構築が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切ったので、テーブルの内容は何も検査されていません。
example.the-stack-got-there-first=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、`fake {fake}` のテーブルが適用するヘルパを末尾再帰に書き換えてください。
example.not-compared-the-table-ran-out-of-stack=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切りました。
example.the-stack-got-there-first-when-comparing=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、テーブルが適用するヘルパを末尾再帰に書き換えてください。それまで、この fake と `example {behavior}` の行が一致するかは不明です。

example.the-evaluation-spent-its-steps=この行の評価が、{budget} ステップの予算内で終わりませんでした。
example.spending-the-budget-is-not-diverging=分かるのは評価が予算内に終わらなかったことだけで、モデルが停止しないとは限りません。止まらない `partial` な再帰もここに来ますし、もう少しで止まる再帰も来ます。モデルが停止するのにステップが足りないなら `souther.example.step.limit` を上げてください。そうでなければ、ループの回数を制限するか、引数の一部に対して再帰するように書き換えてください。
example.the-evaluation-reached-its-depth-limit=この行の評価が、再帰深度の上限 {limit} に達しました。
example.reaching-the-depth-limit-is-not-diverging=分かるのは再帰が上限より深くなったことだけで、再帰が終わらないとは限りません。データが本当にそれだけ深いなら `souther.example.recursion.depth` を上げてください。そうでなければ、引数の一部に対して再帰して終わるように書き換えてください。

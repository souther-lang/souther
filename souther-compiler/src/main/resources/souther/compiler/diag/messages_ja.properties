example.the-name-is-already-declared=`{name}` は `{module}` が既に宣言しているので、ここの行はそちらを読みます。この値を改名するか、これを消してモジュールの宣言を名指してください。
example.the-module-is-not-being-compiled=`examples for {module}` はコンパイル対象にないモジュールを指しています。
example.the-row-reached-an-unreachable-point=この行は、モデルが起こり得ないと宣言した地点に到達しました: {reason}
example.either-the-row-or-the-reason-is-wrong=行がモデルの除外している組み合わせを書いているか、その `unreachable` に書かれた理由が成り立っていないかのどちらかです。
example.no-row-expects-that-case=`{caseName}` を期待する行がないので、`{behavior}` がその答えを返すことを何も述べていません。

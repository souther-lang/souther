name.a-block-is-not-a-value=ブロックは値ではありません。引数として渡すか `let` に束縛して適用できますが、返したり data に格納したりはできません。
check.construct.title=構築できません
data.data-cannot-be-constructed=data `{data}` は構築できません。必須フィールドを通じて自分自身の値を必要とし、底に達しません。自己参照フィールドを任意（`?`）か `List` にしてください。
data.it-cannot-be-constructed-here=ここで `{data}` を構築することはできません。

# `behavior` を実装する `let` は契約に合わせる
check.impl.title=実装の不一致
behavior.an-implementations-return-comes-from-the-behavior=`let {let}` は `behavior {behavior}` の実装なので、戻り値の型は behavior から取られます。宣言しないでください。
behavior.the-implementation-takes-another-number-of-parameters=`let {let}` は引数を {takes} 個取りますが、`behavior {behavior}` の入力は {inputs} 個、注入される引数は {injected} 個です。
behavior.an-implementations-parameters-take-their-types-from-it=`let {let}` は `behavior {behavior}` の実装なので、引数の型は behavior から取られます。`{parameter}` に型注釈を付けないでください。
behavior.an-injected-parameter-is-out-of-order=`let {let}` の引数 `{parameter}` は `{shouldBe}` であるべきです。`depends on` が挙げた名前は宣言順に末尾の引数になります。

# ヘルパ `let` の宣言規則
check.helper.title=ヘルパの宣言
helper.a-parameter-needs-its-type=ヘルパ `let {helper}` は引数 `{parameter}` に型注釈を付ける必要があります。
helper.a-parameter-is-not-determined-by-the-body=ヘルパ `let {helper}` の引数 `{parameter}` は本体から型が決まりません。型注釈を付けてください。
helper.this-use-names-no-type=この使い方は型を名指していません
helper.a-parameter-is-only-read-through-a-field=ヘルパ `let {helper}` の引数 `{parameter}` はフィールド越しにしか読まれておらず、フィールドは型を名指しません。型注釈を付けてください。
helper.a-field-is-read-off-it-and-that-names-no-type=フィールドを読んでいますが、それは型を名指しません
helper.a-function-typed-parameter-needs-its-type=ヘルパ `let {helper}` の引数 `{parameter}` は関数として使われています。関数型引数には型注釈が必要です。
helper.the-body-is-not-what-the-helper-declares=ヘルパ `let {helper}` は {declared} を返すと宣言していますが、本体は {body} です。
name.a-recursive-helper-must-declare-its-return-type=再帰ヘルパ `let {helper}` は戻り値の型を宣言する必要があります（`let {helper} (...) : <型> = ...`）。再帰を通じて結果を推論できないためです。
name.a-recursive-helper-is-pure=再帰ヘルパ `let {helper}` は純粋であり、注入 behavior `{injected}` を呼べません。作用はこのヘルパを呼ぶ behavior に置いてください。
check.invariant.invalid.title=不正な不変条件
invariant.the-invariant-reaches-a-partial-helper=`{data}` の不変条件が `partial` ヘルパ `{partial}` に到達しています（{through}）。`partial` は停止性を保証しません。不変条件は構築時に検査され、停止する必要があります。
invariant.the-invariant-constructs-a-data=`{data}` の不変条件が `{constructs}` を構築していますが、不変条件はデータを構築できません。構築される値を観測するだけで、別の値を作ってはいけません。
invariant.the-named-clause-constructs-a-data=`{data}` の不変条件 `{clause}` が `{constructs}` を構築していますが、不変条件はデータを構築できません。構築される値を観測するだけで、別の値を作ってはいけません。
invariant.the-clause-reaches-that-construction=不変条件 `{clause}` からその構築に到達しています。
invariant.this-clause-reaches-that-construction=この不変条件からその構築に到達しています。
invariant.a-unit-data-has-nothing-to-observe=`{data}` は単位データなので、この不変条件が観測するフィールドがなく、拒める値もありません。この句を削除するか、制約の対象となるフィールドを `{data}` に持たせてください。
invariant.underscore-cannot-name-a-clause=`_` は `{data}` の invariant の句の名前にできません。名前のない句には attempt が `| _ -> ...` で答えるので、`_` という名前の句は名前で答えられません。
invariant.name-the-clause-or-leave-it-unnamed=別の名前を付けるか、名前を付けずに書いてください。名前のない句も検査され、`| _ -> ...` が答えます。
invariant.an-invariant-answers-on-every-path=`{data}` の invariant が `unreachable` を答えていますが、invariant は構築される値が条件を満たすかどうかを、通るすべての経路で答えるものです。起こり得ない経路は、モデルが作る値についての規則であって、この値についての規則ではありません。
invariant.two-clauses-share-one-name=`{data}` が `{clause}` という名前の invariant の句を二つ宣言しています。名前は試みる構築と境界のエラーが規則を呼ぶためのものなので、二つの規則が共有できません。
check.data.invalid.title=不正なデータ定義
data.a-data-with-an-empty-body=データ `{data}` の本体が空です。これは値がひとつだけの型、つまり単位データであり、単位データは本体を書かずに宣言します。
data.write-it-as-a-unit-data-or-give-it-fields=`data {data}` と書いて名前だけで構築するか、`{data}` が持つフィールドを与えてください。

# モジュール／exposing
check.module.title=モジュールのエラー
module.exposing-is-type-granular=`exposing` は型単位です。data の `decoder`/`encoder` は data を公開すれば常に public です。`{notThis}` ではなく `{write}` と書いてください。
module.exposing-names-an-imported-name=`exposing` が `{name}` を挙げていますが、これはこのモジュールに import されたもので、ここで定義されていません。`exposing` はモジュール自身の定義を挙げるもので、import 名を再公開しません。
module.exposing-names-something-this-module-does-not-declare=`exposing` が `{name}` を挙げていますが、これはこのモジュールの data でも behavior でもありません。
declaration.an-injection-target-cannot-depend-on-anything=behavior `{behavior}` は `let` を持たない注入対象なので、`depends on` を宣言できません。呼び出すか合成する behavior が要求を持ちます。

# decoder/encoder 境界を越えてはならない型
check.boundary.title=境界の型
type.a-parameter-is-an-anonymous-union=引数 `{parameter}` は無名の直和型 `{type}` です。behavior の引数は単一の名前付き型を指す必要があります。`data ... = {type}` を宣言してその名前を取ってください。
type.a-function-has-no-value-to-compare=関数は比較する値を持たないので、{given} は `==` / `/=` の被演算子になれません。
type.a-set-element-is-compared-and-a-function-is-not=Set は重複を持たない集合で、そのために要素どうしが等しいかを問います。関数は比較する値を持ちません: {given}。
type.a-map-key-is-compared-and-a-function-is-not=Map はキーで値を引くので、キーどうしが等しいかを問います。関数は比較する値を持ちません: {given}。
type.a-parameter-carries-a-function=引数 `{parameter}` は関数を含みます（{type}）。関数は外部表現を持たないので、behavior の入力として境界を越えられません。
type.an-output-carries-a-function=`{behavior}` は関数を出力します（{type}）。関数は外部表現を持たないので、behavior の出力として境界を越えられません。
type.an-output-carries-an-optional=`{behavior}` の出力は optional ({type}) を含みます。
type.a-parameter-carries-an-optional=引数 `{parameter}` は optional ({type}) を含みます。
type.a-model-type-owns-the-absence=その optional がある位置で、不在をモデルの型に持たせてください。data の `?` フィールドに置くか、和型のケースとして名付けます。出力そのものが optional なら、その和型は `-> A | 不在のケース` と直接書けます。
type.a-parameter-takes-a-type-the-language-declares=引数 `{parameter}` は `{type}` を取ります。これはこのモデルではなく言語が宣言している型です。
type.an-output-is-a-type-the-language-declares=`{behavior}` は `{type}` を答えます。これはこのモデルではなく言語が宣言している型です。
type.declare-it-as-a-type-of-the-model=これをモデルの型として宣言し、境界にはそちらを書いてください。behavior が答えるケースにも、受け取る data にもできます。
type.a-parameter-is-a-tuple=引数 `{parameter}` はタプルです。タプルは外部表現を持たず境界を越えられないため、behavior の入力は名前付き data でなければなりません。
type.an-output-is-a-tuple=behavior `{behavior}` はタプルを出力します。タプルは境界を越えられないため、behavior の出力は名前付き data かその直和でなければなりません。

# コレクション型に型引数がない
check.typearg.title=型引数がありません
type.a-list-needs-its-element-type=`List` には型引数が必要です（例: `List<Int>`）。
type.a-set-needs-its-element-type=`Set` には型引数が必要です（例: `Set<String>`）。
type.an-option-needs-its-type-argument=`Option` には型引数が必要です。
type.a-map-needs-its-value-type=`Map` には値の型が必要です（例: `Map<String, Int>`）。
type.a-fields-map-cannot-be-keyed-by-that=`{field}` は境界を越えるので、持っている Map のキーを {key} にはできません。
type.a-parameter-map-cannot-be-keyed-by-that=引数 `{parameter}` が持つ Map のキーが {key} で、境界を越えられません。
type.an-output-map-cannot-be-keyed-by-that=`{behavior}` が返す Map のキーが {key} で、境界を越えられません。
type.a-map-is-a-json-object-keyed-by-strings=Map の外部表現は JSON オブジェクトで、そのキーは文字列です。境界を越える Map のキーは、裸の文字列として書き出され読み取られる型でなければなりません。behavior の本体内であれば Map のキーは任意の値でかまいません。

# 比較・算術のオペランド
type.comparison-needs-ordered-values-of-one-type=比較の2つのオペランドは同じ順序型（Int, String, Decimal, Date, DateTime、それらの newtype、または1つの列挙）の値でなければなりません。ケース同士が比較できるのは、両方を挙げている直和が1つに定まるときだけです。ここでは {one} と {other} です。
arithmetic.an-operand-is-not-a-number=算術のオペランドは Int か Decimal でなければなりませんが、{operand} です。
arithmetic.two-different-newtypes={left} と {right} は別の newtype なので、算術では組み合わせられません。
arithmetic.convert-one-to-the-others-newtype=同じものを測っているなら、一方をもう一方の newtype に変換してから組み合わせてください。違うものなら、組み合わせられるものがありません。
arithmetic.a-product-changes-dimension={left} と {right} の積はどちらの量でもなく、その次元をこの言語は表現しません。
arithmetic.compute-on-value-and-build-the-product=`.value` で計算し、積が属する newtype を構築してください。
arithmetic.a-quotient-changes-dimension={left} と {right} の商はどちらの値でもなく、その次元をこの言語は表現しません。
arithmetic.compute-on-value-and-build-the-quotient=`.value` で計算してください。商が newtype なら、その結果から構築してください。
arithmetic.a-reciprocal-changes-dimension={value} を {newtype} で割ると逆数になり、そこで変わる次元をこの言語は表現しません。
arithmetic.compute-on-value-and-build-the-reciprocal=`.value` で計算してください。結果が newtype なら、そこから構築してください。
arithmetic.only-a-literal-is-read-as-the-newtype={newtype} として読まれるのは隣に書かれたリテラルだけで、この {value} は書き下されていません。
arithmetic.build-it-where-the-value-comes-from=値の出どころで {newtype} を構築するか、`.value` で計算してください。
arithmetic.a-value-of-another-base={newtype} が包むのは {base} で、この {value} はそれではありません。
arithmetic.what-each-operator-takes-beside-a-newtype=`*` はどちら側でも {base} でスケールします。`/` がスケールになるのは `{newtype} / {base}` の向きだけで、`{base} / {newtype}` は逆数です。`+` と `-` が {base} を読むのは書き下したリテラルのときだけです。それ以外は {newtype} を構築するか、`.value` で計算してください。
arithmetic.a-newtype-with-no-direct-numeric-base=算術が届くのは value が直接 Int か Decimal の newtype で、{newtype} が包むのは {wrapped} です。
arithmetic.reach-the-base-with-value=算術が {newtype} の value を自動で取り出すことはありません。`.value` と書いて {wrapped} にしてから、{wrapped} の規則に従ってください。

# 直和の定義と導出 decoder/encoder（codec）
check.sum.title=直和の定義
check.codec.title=codec
behavior.unknown-case-in-a-sum=直和 `{sum}` に未知のケース `{caseName}` があります。
behavior.a-case-is-declared-in-another-module=`{caseName}` は `{module}` で宣言されているので、直和 `{sum}` のケースにはできません。
behavior.a-sums-cases-are-declared-with-it=直和のケースはその直和と一緒に宣言します。生成される直和は sealed interface で、それを実装できるのは自分のモジュールだけです。`{caseName}` は境界で消費するか、このモジュールのケースに再表現してください。
name.the-expression-nests-too-deeply=このソースの式が深く入れ子になりすぎていて、コンパイラが辿れません。`let` で名前を付けて分割してください。
behavior.a-sum-contains-itself=直和 `{sum}` が {through} を経由して自分自身を含んでいます。直和のケースはその型が取りうる値なので、ケースが直和自身になることはできません。
behavior.a-built-in-option-case-cannot-be-declared=`{name}` は組み込みの Option ケースなので data 型として宣言できません。
codec.not-a-case-of=`{caseName}` は `{sum}` のケースではありません。
codec.case-needs-a-decoder=ケース `{caseName}` には decoder が必要です。
codec.case-needs-an-encoder=ケース `{caseName}` には encoder が必要です。
codec.the-encoder-is-missing-a-case=`{sum}` の encoder にケース `{caseName}` がありません。
data.spread-is-not-a-product-data=`...{spread}` はスプレッドできません（直積 data ではありません）。
codec.an-iso-text-encoder-takes-a-temporal-value=ISO テキスト encoder は Date か DateTime を必要としますが、{given} です。
codec.an-optional-encoder-takes-an-optional=optional encoder は Option を必要としますが、{given} です。
codec.has-no-encoder=`{data}` には encoder がないため、`{data}.encode` を呼べません。
codec.a-list-encoder-takes-a-list=`list(...)` encoder の source は List でなければなりませんが、{given} です。
codec.a-set-encoder-takes-a-set=set encoder の source は Set でなければなりませんが、{given} です。
codec.a-map-encoder-takes-a-map=map encoder の source は Map でなければなりませんが、{given} です。
codec.has-no-decoder=`{data}` には decoder がないため、`{data}.decoder` を呼べません。
codec.the-decoder-builds-another-type=`{data}` の decoder は `{data}` を構築しなければなりませんが、`{builds}` を構築しています。
data.not-a-field-of=`{field}` は `{data}` のフィールドではありません。
data.a-field-expects-another-type=フィールド `{field}` は {expects} を必要としますが、{got} です。
data.spread-is-not-a-data-value=スプレッド `..{spread}` は data の値か、全ケースが同じ data をスプレッドしている直和の値でなければなりません。
data.name-the-union-with-a-declaration=`{union}` はその場に書かれたユニオンなので、ケースが何を共有しているかを宣言しているものがありません。`data` 宣言でユニオンに名前を付ければ、全ケースがスプレッドしている部分をそこからスプレッドできます。
data.spread-of-a-sum-whose-cases-share-nothing=スプレッド `..{spread}` は `{sum}` のケースが共有するフィールドを写しますが、共有しているものがありません。全ケースがスプレッドしている data がないためです。`{spread}` を `match` で開いて、ケースをスプレッドしてください。

# パイプライン／予約名／数値
check.pipe.title=パイプライン
behavior.a-stage-after-the-first-takes-one-input=`{stage}` は入力を {takes} 個取るため、`{pipeline}` の `>->` で後続の段にできません。最初以外の段は入力を1つ取ります。インラインで呼ぶか `match` で分岐を開いてください。複数入力を取れるのは最初の段だけです。
behavior.a-boundary-edge-is-not-a-stage=decode/encode は境界の縁であり、パイプラインの段ではありません。`>->` は behavior のみを合成します。
behavior.a-pipeline-composes-with-itself=パイプライン `{pipeline}` が自分自身と合成しています（循環）。
check.reserved.title=予約された名前
name.a-binding-may-not-shadow-a-built-in=`{name}` は組み込みの値なので束縛名に使えません。組み込みを隠してしまいます。別の名前を選んでください。
type.the-pattern-must-be-written-out=`String.matches` のパターンはコンパイル時に文字列として評価できなければなりません。そこで検証するためです。文字列リテラルを書くか、リテラルとトップレベルの `let` で名付けた値を `++` でつないでください。
type.the-pattern-is-not-a-regular-expression=`String.matches` のパターンが正規表現として不正です: {why}
type.not-a-union-member=`{member}` は直和のメンバーになれません。メンバーになれるのは `match` の腕が名前で指せる型 —— プリミティブか、このモジュールで宣言したか import した data 型です。
type.one-name-for-two-members=1つの直和に `{name}` と書かれる型が2つあります。`{one}` が宣言したものと `{other}` が宣言したものです。
data.a-case-declares-the-discriminator-field=`{caseName}` は `{sum}` のケースで、フィールド `{field}` を宣言しています。これはその直和がフィールドの隣に書く判別子と同じ名前です。
data.a-member-declares-the-discriminator-field=`{member}` は `{behavior}` の出力のメンバーで、フィールド `{field}` を宣言しています。これはそのユニオンがフィールドの隣に書く判別子と同じ名前です。
data.the-tag-and-the-field-want-one-key=タグとフィールドが同じキー `{field}` を取り合い、後に書かれた方だけが残ります。フィールドを改名してください。
type.a-member-is-named-by-its-written-name=match の腕はメンバーを書かれた名前で指し、外部表現の `"type"` も同じ名前を使うので、1つの名前が2つのメンバーを指すことはできません。どちらかをこのモジュールの型として表し直してください。
module.a-member-reaches-the-union-through-a-data=`{data}` の出力にメンバー `{member}` があります。これはこのモジュールが宣言した型ではないので、生成されるケースクラス `{through}` を介して直和に加わりますが、その名前は `data {caseClass}` が既に使っています。
module.a-member-reaches-the-union-through-a-behavior=`{behavior}` の出力にメンバー `{member}` があります。これはこのモジュールが宣言した型ではないので、生成されるケースクラス `{through}` を介して直和に加わりますが、`behavior {caseClass}` を大文字化した名前と同じです。
module.rename-the-member-or-the-type-it-collides-with=このモジュールが宣言していないメンバーは、自分の名前に `Case` を付けた `{member}` を介して直和に加わります。その名前を持っている方を改名してください。
module.two-members-join-through-one-case-class=`{one}` と `{other}` はどちらもこのモジュールの直和のメンバーで、どちらも生成されるケースクラス `{caseClass}` を介して加わります。
module.a-member-goes-by-its-own-name-with-case-after-it=メンバーは自分の名前に `Case` を付けた名前で加わるので、同じ綴りの2つの型が、別々の behavior であってもここで両方メンバーになることはできません。どちらかをこのモジュールの型として表し直してください。

# 第一級関数と関数型のヘルパ引数
check.fn.title=関数
helper.the-block-takes-another-number-of-arguments=`let {helper}` の `{parameter}` に渡されたブロックは引数を {takes} 個取りますが、{written} 個で書かれています。
helper.the-block-answers-another-type=`let {helper}` の `{parameter}` に渡されたブロックは {must} を返さなければなりませんが、{returns} を返します。
helper.a-value-where-a-function-is-taken=`let {helper}` の `{parameter}` は関数を必要としますが、`{written}` は値であって関数ではありません。
helper.the-function-goes-to-another-argument=`{call}` の引数 {at} は `{parameter}` で、関数を受け取りません。関数は引数 {functionAt}（`{functionParameter}`）に渡します。
helper.write-the-call-this-way=`{call}({shape})` の順で書いてください。
helper.this-argument-takes-a-function=`{call}` の引数 {at} は `{parameter}` で、関数を受け取ります。名前付き関数かラムダを渡してください。
helper.this-argument-takes-no-function=`{call}` の引数 {at} は `{parameter}` で、関数を受け取りません。ラムダやフィールドゲッターはここに書けません。
helper.the-function-takes-another-number-of-arguments=`{call}` は関数を {called} 個の引数で呼びますが、関数は {takes} 個取ります。
helper.the-function-takes-another-type=`{call}` の要素型 {given} は、{takes} を取る関数に渡せません。
helper.the-step-answers-another-type-than-the-accumulator=`{call}` の step は {answers} を返しますが、積み上げる accumulator が持つのは {accumulator} です。
helper.this-expects-a-block=`{call}` はブロックを必要とします（例: `{call}((acc, x) -> ..., seed, xs)`）。
helper.the-block-is-written-with-another-number-of-parameters=このブロックは引数を {takes} 個取りますが、{written} 個です。
helper.the-functions-type-cannot-be-read=関数 `{name}` の型を推論できません。型を書く（`let {name}: (Int) -> Bool = ...`）か、このスコープで適用して引数の型を読めるようにしてください。ラムダの中の適用はそのラムダのスコープなので、ここでは何も言いません。
helper.the-function-is-applied-at-two-types=関数 `{name}` が異なる引数型で適用されています: {one} と {other}。
helper.the-lambda-is-applied-with-another-number-of-arguments=このラムダは引数を {takes} 個取りますが、{applied} 個で適用されています。
helper.the-branches-answer-different-function-types=2つの分岐が異なる関数型を生成します: {one} と {other}。

# 残り
behavior.a-composition-is-already-its-own-implementation=`let {name}` は合成 `behavior {name}` を実装できません。合成は既に自身の実装です。
behavior.the-body-is-not-what-the-behavior-returns=behavior `{behavior}` は {returns} を返しますが、`let` の本体は {body} です。
data.a-tuple-cannot-be-a-field=タプルは data のフィールドにできません（`{data}.{field}`）。タプルは外部表現を持たず decoder/encoder 境界を越えられません。名前付き data を使ってください。
data.a-field-takes-a-method-of-object=`{field}` は `{data}` のフィールドにできません。生成クラスは同名のアクセサでフィールドを読みますが、`{field}()` はすべての JVM の値が既に持つメソッドです。別の名前にしてください。
data.spread-supplies-the-wrong-type=スプレッドは `{field}` を {supplied} として提供しますが、`{type}` は {needed} を必要とします。
codec.the-element-encoder-is-not-for-the-element-type=要素 encoder {encoder} は要素型 {elementType} と一致しません。
match.the-branches-disagree=match の分岐の型が食い違います: {one} と {other}。
name.not-a-standard-library-function=`{name}` は標準ライブラリの関数ではありません。
type.it-expected-one-type-and-got-another={what}: {expected} を期待しましたが、{got} でした。

# モジュールのリンク・import・定数の不変条件
data.the-written-value-violates-the-invariant=`{value}` は不変条件に違反しています。
data.the-written-value-violates-the-clause=`{value}` は invariant の句 `{clause}` に違反しています。
module.the-module-is-in-the-reserved-namespace=module `{module}` は予約された `souther` 名前空間にあります。コンパイラは souther.string / souther.list / souther.map / souther.bool を同梱しており、ユーザーのモジュールは予約名を使えません。
module.the-module-takes-the-standard-library-qualifier=module `{module}` は標準ライブラリの修飾子 `{module}` に予約された名前を使っています（`{module}. …` / `import {module} ( … )` のように）。別のモジュール名を選んでください。
module.duplicate-module=モジュール `{module}` が重複しています。
module.a-module-it-needs-is-not-on-the-path=モジュール `{module}` は `{needed}` を必要としていますが、`{needed}` もパス上にありません。
module.add-it-to-this-projects-dependencies=`{module}` は、依存しているモジュールがさらに依存しているものです。このプロジェクトの依存に足してください。
module.the-module-is-compiled-here-and-on-the-path=モジュール `{module}` はここでコンパイルされ、同時にパス上にもあります。
module.rename-it-or-drop-the-dependency=1つの名前が2つのモジュールを指すことはできません。こちらをリネームするか、`{module}` を提供している依存を外してください。
module.the-module-was-compiled-by-another-souther=モジュール `{module}` は Souther {by} でコンパイルされていて、import する側が何に触れてよいかについて、このコンパイラと一致していません。
module.rebuild-it-or-compile-against-what-built-it=`{module}` をこのコンパイラでビルドし直すか、それをビルドしたバージョンでコンパイルしてください。
module.the-class-carrying-the-declaration-is-not-on-the-path=モジュール `{module}` は `{name}` を宣言していると言っていますが、その宣言を載せたクラスが classpath にありません。
module.the-jar-it-came-from-is-incomplete=`{jar}` の jar が不完全です。ビルドし直してください。
module.unknown-module=未知のモジュール `{module}` です。
module.the-module-does-not-expose-it=`{name}` は `{module}` から公開されていません。
module.the-module-declares-no-such-name=`{name}` は `{module}` に定義されていません。
invariant.the-guards-do-not-establish=ここでの `{data}` の構築は `{unsettled}` に違反する可能性があります。ガードがそれを確立していません。`guard` でガードするか、関係を `{data}`（または入力）の `invariant` に宣言してここで仮定させてください。ここで確立済み: {settled}。
invariant.the-guards-do-not-establish-the-invariant=ここでの `{data}` の構築は不変条件に違反する可能性があります。ガードが不変条件を確立していません。`guard` でガードするか、関係を `{data}`（または入力）の `invariant` に宣言してここで仮定させてください。
invariant.reify-the-relation-onto-an-input=入力間の関係が `{data}` の句を保証するなら、入力データの `invariant` として宣言してください。境界で一度検査され、ここでは仮定されます。
invariant.the-value-is-one-the-invariant-rejects=ここでの `{data}` の構築は `{unsettled}` に違反します。組み立てている値をその句が拒みます。値を直してください。
invariant.the-value-is-one-the-invariant-rejects-unnamed=ここでの `{data}` の構築は不変条件に違反します。組み立てている値を不変条件が拒みます。値を直してください。
invariant.the-value-is-rejected-on-a-reachable-path=ここでの `{data}` の構築は、到達可能な経路で `{unsettled}` に違反します。ここで仮定されていることの下では、組み立てている値をその句が拒みます。値を直すか、違反ケースがここに届かないよう経路をガードしてください。
invariant.the-value-is-rejected-on-a-reachable-path-unnamed=ここでの `{data}` の構築は、到達可能な経路で不変条件に違反します。ここで仮定されていることの下では、組み立てている値を不変条件が拒みます。値を直すか、違反ケースがここに届かないよう経路をガードしてください。
import.imported-name-collides-with-a-declaration=import した `{name}` が、このモジュールの同名の定義と衝突しています。
import.rename-or-qualify-the-colliding-name=1つの名前が2つのものを指すことはできません。ローカルの定義をリネームするか、import をやめて import 先をモジュール名で修飾して参照するか、ローカルの定義を削除して import した方を使ってください。
module.the-name-is-imported-from-two-modules=`{name}` を `{one}` と `{other}` の両方から import しています。
module.it-was-already-imported-here=`{name}` はここで `{from}` から import されています。
module.import-at-most-one-and-qualify-the-other=1つの名前が2つの型を指すことはできません。import するのはどちらか一方だけにして、もう一方はモジュール名で修飾して（`{module}.{name}`）、または `import ... as` の別名で参照してください。
module.the-same-name-is-imported-twice-from-one-module=同じモジュールから同じ名前を2回 import しています。2つ目を削除してください。
import.name-is-not-a-standard-library-function=`{name}` は標準ライブラリのモジュール `{module}` の関数ではありません。
import.name-is-published-by-two-modules=`{name}` は `{publishedBy}` と `{andBy}` の両方から公開されています。両方を import せず、修飾して呼んでください。
module.a-behavior-is-named-from-two-modules=behavior `{behavior}` を `{one}` と `{other}` の両方から参照しています。
module.a-behaviors-name-is-also-its-injected-field=behavior の名前は生成クラスの注入フィールド名でもあるので、1つのモジュールが `{behavior}` という behavior を2つ受け取ることはできません（修飾してもフィールドは分かれません）。両方が必要なら、このモジュールで区別できる名前の behavior を2つ宣言してください（`let` を書かない behavior が注入対象になります）。どちらにどの上流の behavior を渡すかは Java 側が決めます。
injection.an-injected-input-rests-on-what-is-kept=`behavior {behavior}` に `let` がないので実装はモジュールの外に置かれますが、入力の `{kept}` が `exposing` にありません。
injection.an-injected-output-rests-on-what-is-kept=`behavior {behavior}` に `let` がないので実装はモジュールの外に置かれますが、出力の `{kept}` が `exposing` にありません。
injection.the-base-class-is-public-whatever-exposing-says=実装が継承する基底クラスは `exposing` に関わらず public で、実装は `apply` を override するときにこの型を書きます。`{kept}` を `exposing` に加えてください。
module.an-exposed-field-rests-on-what-is-kept=`{exposed}` は公開されていますが、そのフィールド `{field}` の型 `{type}` は公開されていません。
module.an-exposed-input-rests-on-what-is-kept=`{exposed}` は公開されていますが、入力の `{input}` は公開されていません。
module.an-exposed-output-rests-on-what-is-kept=`{exposed}` は公開されていますが、出力の `{output}` は公開されていません。
module.what-reaches-out-may-not-rest-on-what-is-kept=モジュールが外に出すものは、自分の中に留めているものに依存できません。読み手には `{kept}` を指す名前がなく、それを載せたクラスにも触れられません。`{kept}` を `exposing` に加えるか、`{exposed}` を `exposing` から外してください。
module.the-alias-is-already-taken=別名 `{alias}` は、このモジュールではすでに `{by}` を指しています。
module.an-alias-is-a-name-nothing-else-answers-to=別名はこのモジュールの中だけでモジュールを呼び替えるものなので、他の何も名乗っていない名前にしてください。
check.import.title=インポート
module.imported-but-never-used-under-this-name=`{name}` は import されていますが、この名前では一度も使われていません。
module.take-it-off-the-import-list=import リストから外してください。他のモジュールが宣言したものは import しなくても修飾して参照できるので、このリストに名前が載る理由は、下のどこかで修飾せずに書かれていることだけです。
module.no-module-of-that-name=`{module}` というモジュールはないので、`{module}.{name}` は何も指しません。
module.it-is-declared-there-and-not-exposed=`{name}` は `{module}` に定義されていますが、公開されていません。
module.the-module-declares-no-such-qualified-name=`{module}` に `{name}` は定義されていません。
type.a-temporal-takes-a-written-string=`{type}(...)` は書かれた文字列を取ります（例: `Date("2026-07-01")` / `DateTime("2026-07-01T09:00")`）。
type.that-is-not-a-temporal-of-that-kind=`{written}` は {type} として読めません。`Date("2026-07-01")` / `DateTime("2026-07-01T09:00")` の形で書いてください。
data.a-newtype-wraps-one-value=`{newtype}` は値を1つ包みますが、{applied} 個の引数で適用されています。
helper.called-with-another-number-of-arguments=ヘルパ `let {helper}` は引数を {takes} 個取りますが、{called} 個で呼ばれています。
helper.an-annotation-on-a-function-binding-is-not-a-function-type=束縛 `{binding}` は関数を保持していますが、その型注釈は関数型ではありません。
helper.write-a-function-type-or-leave-the-annotation-off=`(Int) -> Bool` のような関数型を書くか、型注釈を外して適用側から決めさせてください。
behavior.a-behavior-capitalizes-onto-a-data=behavior `{behavior}` は先頭が大文字化され JVM クラス `{jvmClass}` になり（spec jvm-behavior）、data `{jvmClass}` と衝突します。クラス名が異なるよう、どちらかをリネームしてください。
behavior.two-behaviors-capitalize-to-one-class=behavior `{one}` と `{other}` はどちらも先頭大文字化で同じ JVM クラス `{jvmClass}` になります（spec jvm-behavior）。クラス名が異なるよう、どちらかをリネームしてください。
behavior.a-union-outputs-interface-collides-with-a-data=`{behavior}` の出力はユニオンなので、sealed interface `{jvmClass}` として生成されます（spec jvm-anonymous-union）が、そのクラス名は `data {jvmClass}` が既に使っています。
behavior.a-union-outputs-interface-collides-with-a-behavior=`{behavior}` の出力はユニオンなので、sealed interface `{jvmClass}` として生成されます（spec jvm-anonymous-union）が、そのクラス名は `behavior {other}` を大文字化した名前と同じです。
behavior.a-union-output-reaches-java-through-that-name=ユニオンを返す behavior は、自分を大文字化した名前に `Result` を付けた `{jvmClass}` で Java に渡ります。その名前を持っている方を改名してください。
data.a-tuple-has-no-external-representation=`{data}` は {what} です。タプルは外部表現を持たず codec を導出できません。名前付き data を使ってください。
data.no-codec-can-be-derived=`{data}` の codec を導出できません。{why} は外部表現を持ちません。
data.a-newtype-may-not-wrap-an-optional=`{newtype}` は `{wraps}?` を包んでいますが、newtype が包むのは1つの値でその外部表現をそのまま受け取るため、値が無いときに何を表すかがありません。
data.wrap-the-value-and-write-the-question-mark-on-the-field=値そのものを包み（`data {newtype} = ...`）、`?` は使う側のフィールドに書いてください。

# --- 束縛パターンで値を開く（match の外） ---
check.open.title=開けません
type.not-a-newtype-to-open-in-a-binding=`{name}` は newtype ではないので、束縛で `{name}(...)` と開くことはできません。
type.a-binding-opens-only-what-every-value-has=束縛はアームが1つなので、その型のどの値も必ず持っているもの（newtype が包む値・タプルの要素・レコードのフィールド）しか開けません。形を持つかどうかが分かれる値は `match` で開いてください。
type.the-pattern-opens-another-type=このパターンは `{opens}` を開きますが、値は `{value}` です。

# --- 構文エラー（レキサ／パーサ） ---
parse.title=構文エラー
parse.a-declaration-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-expression-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.a-pattern-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-example-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-expression-was-expected=ここには式が必要です。
parse.a-literal-was-expected=ここにはリテラルが必要です。
parse.a-statement-was-expected=ここにはブロックの行が必要です。
parse.a-pattern-was-expected=ここにはパターンが必要です。
parse.a-source-file-starts-with-a-module-declaration=ソースファイルは `module` 宣言から始めます（単一ファイルなら省略できます）。
parse.a-top-level-definition-starts-with-a-keyword=トップレベルの定義は `data`・`behavior`・`let` のいずれかで始めます。
parse.a-behavior-is-written-with-a-colon-or-an-equals=behavior は引数の前に `:` を書くか（シグネチャ）、`=` を書きます（合成）。
parse.intrinsic-is-a-core-privilege=intrinsic はコアの特権です。予約された `souther` 名前空間のモジュールだけが宣言できます。
parse.private-is-a-core-privilege=private はコアの特権です。予約された `souther` 名前空間のモジュールだけが宣言できます。
parse.a-type-variable-is-only-allowed-in-the-core=型変数 `{variable}` は core（予約された `souther` 名前空間）でのみ使えます。ユーザーのモデルは有界のままです。
parse.an-optional-is-only-written-on-a-field-or-in-the-core=オプショナル型 `T?` は data のフィールド、または core（予約された `souther` 名前空間）でのみ書けます。ユーザーのモデルはそれ以外の場所でオプショナルを名前で呼びません。
parse.leave-the-type-off-and-the-optional-is-inferred=ヘルパーの戻り型なら、型を書かなければオプショナルのまま推論されます。不在がモデル自身のものなら、0個か1個のリストを返して `List.flatMap` を使ってください。
parse.a-question-mark-follows-a-sum-of-cases=`?` は単一の型をオプショナルにしますが、{cases} ケースの sum に付いています。
parse.unreachable-states-its-reason-as-a-string=`unreachable` は到達しない理由を文字列で書きます。`unreachable "twenty insured years cannot precede the age of thirty"` のように書いてください。
parse.a-block-ends-in-one-expression=ブロックは最後に値となる式を1つ置きますが、このブロックには `let`／`guard` の行しかありません。改行は文の区切りではないので、独立した行に書いた結果式が上の行の続きとして読まれることがあります。
parse.options-wrapped-value-is-bound-positionally=Option の中身は位置で束縛します。`| Some as v` ではなく `| Some v` と書きます。
parse.some-parens-open-a-wrapped-newtype=値そのものを束縛するには `| Some v` と書きます。`Some(...)` は包まれた newtype を開く形で、`| Some({newtype} v)` のように書きます。
parse.a-case-value-is-bound-with-as=ケースの値は `as` で束縛します。`| {caseName} {bound}` ではなく `| {caseName} as {bound}` と書いてください。位置で束縛できる中身を持つのは `Some` だけです。
parse.a-records-fields-are-destructured-directly=レコードのフィールドは直接分解します。`| Some(型 {{ field }})` ではなく `| Some {{ field }}` と書いてください。括弧は newtype を開く形です。
parse.a-newtype-cannot-wrap-a-tuple=newtype は包んだ型の外部表現をそのまま受け取りますが、タプルには外部表現がありません。名前付きの data を包んでください。
parse.a-newtype-cannot-wrap-a-function=newtype は包んだ型の外部表現をそのまま受け取りますが、関数には外部表現がありません。
parse.a-sums-cases-are-declared-named-data=sum のケースは宣言済みの名前付き data への参照なので、総称型がケースになることはありません。data を宣言してその名前を書いてください。
parse.a-field-type-is-not-an-anonymous-union=フィールド `{field}` に匿名 union が書かれていますが、フィールドが持つ型は1つです。ケースをまとめた `data` を宣言して、その名前をフィールドに書いてください。
parse.an-anonymous-union-is-not-written-inside-another-type=匿名 union は複数の型を並べたもので、この位置が取る型は1つです。ケースをまとめた `data` を宣言して、その名前をここに書いてください。
parse.an-optional-is-not-written-inside-another-type=`?` は data フィールド自身の optional を表す記法で、別の型の中には書けません。型として書くなら `Option<T>`、あるいは `?` を保持するフィールドの側に付けてください。
parse.an-example-only-file-starts-with-its-module=example だけのファイルは、その example が属するモジュールから始めます: `examples for <モジュール>`
parse.a-dependency-clause-is-two-words=behavior の依存句は2語です: `depends on <名前>`
parse.a-let-with-no-parameters-is-written-without-parens=`let {name}` は引数を取らないので `()` は書きません。引数リストのある `let` は関数を、無い `let` は値を定義します。
parse.an-example-needs-at-least-one-row=example には `|` で始まる行が少なくとも1つ必要です。
parse.a-fake-needs-at-least-one-row=fake には `|` で始まる行が少なくとも1つ必要です。
parse.a-type-variable-needs-a-name-after-the-apostrophe=型変数には `'` の後ろに名前が必要です（例: `'a`）。
parse.a-fractional-literal-needs-the-m-suffix=小数リテラルは Decimal です。`m` を付けてください（例: `{literal}m`）。Souther に浮動小数点型はありません。
parse.a-string-literal-is-not-closed=この文字列リテラルが行末までに閉じられていません。
parse.an-unexpected-character=予期しない文字 `{character}` です。
tok.name=名前
tok.integer=整数
tok.decimal=小数
tok.string=文字列
tok.typevar=型変数

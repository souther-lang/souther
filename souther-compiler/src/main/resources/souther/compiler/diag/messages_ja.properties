# behavior 合成の型不一致（E1701）
declaration.these-behaviors-cannot-be-composed=この behavior 同士は合成できません。左の behavior の出力が、右の behavior の入力に受け取られません。
declaration.make-the-left-output-a-case-the-right-accepts=左の出力を右の behavior が受け取れるケースにするか、余分なケースをこの段の前で処理してください。

# --- コード付き宣言エラー ---

# 構築権限（E1002 不足、E1006 過剰）
declaration.it-constructs-without-declaring-it=behavior `{behavior}` は `{data}` を構築していますが、`constructs {data}` を宣言していません。
declaration.add-the-constructs-entry=`{behavior}` に `constructs {data}` を追加するか、ここで {data} を構築するのをやめてください。
declaration.it-declares-constructs-and-never-builds=behavior `{behavior}` は `constructs {data}` を宣言していますが、{data} を構築していません（既存の値を素通ししています）。
declaration.remove-the-constructs-entry=`constructs` 句から `{data}` を外してください。
declaration.it-names-a-unit-data-in-constructs=behavior `{behavior}` は `constructs` に `{data}` を書いていますが、unit data は construction set に属しません。

# depends on（E1602 不足、E1603 過剰）
declaration.it-calls-something-with-no-implementation=`let {let}` は実装のない `{called}` を呼んでいますが、`behavior {behavior}` は `depends on {called}` を宣言していません。
declaration.add-the-depends-on-entry=`behavior {behavior}` に `depends on {called}` を追加してください。
declaration.it-declares-depends-on-and-never-calls-it=`behavior {behavior}` は `depends on {dependency}` を宣言していますが、`let {let}` はそれを呼んでいません。
declaration.remove-the-depends-on-entry=`depends on` 句から `{dependency}` を外してください。

# `?` フィールドに値を与える場所以外で書かれた `Some` / `None`（E1303）
declaration.null-is-not-part-of-the-language=`null` はこの言語にありません。`?` を付けたオプショナルのフィールドを使ってください。

declaration.cyclic-module-dependency=モジュールの依存が循環しています。

declaration.some-is-not-a-call=`Some(...)` は呼び出しではありません。`?` フィールドに書いた値は自動で包まれ、そこがオプショナルの作られる唯一の場所です。
declaration.write-the-value-on-its-own=`?` フィールドに値を与える場所なら、値だけを書いてください。それ以外の場所では、オプショナル（`?` フィールド・`Map.get`・`List.find`）は読むだけで作りません。
declaration.nothing-here-is-asking-for-none=`None` は `?` フィールドの空の値ですが、ここではそれを求めているものがありません。
declaration.make-absence-a-case-of-its-own-sum=値がないことがモデルにとって意味を持つなら、それを独自の直和のケースにしてください。`List.filterMap` はステップがオプショナルを返すので、そうした不在は表せません。0個か1個の要素のリストを返すステップを `List.flatMap` に渡してください。

# 位置が型を述べていないところに書かれた `unreachable`（E1307）
name.nothing-says-what-this-position-holds=ここにはこの位置の型を書いたものがなく、`unreachable` は値を返さないので型を推論できません。
name.write-it-where-the-type-is-stated=型が書かれている位置に書いてください。値を返す腕の隣の腕、フィールド、宣言された戻り値、型注釈のある束縛などです。

# 注入 behavior が生成できないデータを構築（E1305）
declaration.an-injected-behavior-constructs-what-is-kept=注入 behavior `{behavior}` は `constructs {data}` を宣言していますが、{data} が exposed でないため、Java から生成できません。
declaration.expose-it={data} を exposed にしてください。

# 合成出力の宣言と推論（E1604）・出力署名（E1605）
declaration.the-declared-output-is-not-what-the-pipeline-produces=behavior {behavior} は出力を {declared} と宣言していますが、パイプラインは {produces} を生成します。
declaration.update-the-output-or-handle-the-case=宣言した出力を更新するか、余分なケースを出力の前で処理してください。
declaration.only-a-composition-takes-an-output-signature=`exposing` が `{name}` に出力署名を与えていますが、`{name}` は合成（`>->`）behavior ではありません。署名が要るのは合成だけです。
declaration.a-composition-the-clause-names-declares-its-output=`exposing` に合成 `{composition}` が書かれているので、そこで出力を宣言する必要があります。
declaration.write-the-output-signature=`exposing ( {composition} : {output} )` と書いてください。

# depends on が注入対象を指していない（E1607）
declaration.depends-on-names-something-that-depends-on-nothing=`behavior {behavior}` は `depends on {dependency}` を宣言していますが、`{dependency}` は何にも依存していないので注入するものがありません。
declaration.remove-it-and-call-it-directly=`depends on` から `{dependency}` を外して直接呼んでください。何にも依存しない behavior は名前で呼べます。
declaration.depends-on-names-no-such-behavior=`behavior {behavior}` は `depends on {dependency}` を宣言していますが、`{dependency}` は自身の要求を持つ behavior としてスコープにありません。
declaration.declare-it-here-or-import-it=`let` のない `behavior {dependency}` をこのモジュールで宣言するか、宣言しているモジュールから import してください。
declaration.depends-on-names-a-composition=`behavior {behavior}` は `depends on {dependency}` を宣言していますが、`{dependency}` は `>->` 合成です。
declaration.a-compositions-requirements-are-not-written=`depends on` から `{dependency}` を外してください。合成の要求は stage から決まり書かれないので、呼ぶ側がそれに寄りかかることはできません。合成するか、stage が依存するものに depends on してください。

# スプレッドのフィールド衝突（E1004）・値の与えられないフィールドを残した構築（E1005）。
# 規則は1つで、ヒントは破り方ごとにある。どれを出すかは構築が何と書かれたかで決まるので、
# スプレッドのないソースにスプレッドの話をすることはない。
data.spread-field-collision=`...{from}` 由来のフィールド `{field}` が、`{heldBy}` の供給するものと衝突しています。
data.construction-is-missing-a-field=`{data}` の構築でフィールド `{field}` が欠けています。
data.give-the-field-a-value=`{field}` に値を与えてください。`{field} = …` と書くか、同名の束縛から埋めるなら `{field}` だけを書きます。
data.supply-the-field-explicitly=`{field}` を明示的に与えてください。スプレッドはそれを提供しません。
data.the-field-is-not-in-what-the-sum-shares=`{field}` は `{sum}` の全ケースがスプレッドしている共通部分にないので、スプレッドはそれを提供しません。明示的に与えるか、`{sum}` を `match` で開いて、それを持つケースから読んでください。
data.the-field-is-in-the-shared-part-of-none-of-these=直和のスプレッドは、全ケースがスプレッドしている共通部分を提供します。`{field}` は次のいずれの共通部分にもありません: {sums}。明示的に与えるか、それを持つケースのある直和を `match` で開いてください。

# invariant の型（E1101）
declaration.an-invariant-expression-is-bool=invariant の式は Bool 型でなければなりませんが、これは {given} です。

# behavior を呼べない場所から呼んだ場合（E1818）・stdlib 修飾
behavior.a-behavior-cannot-be-called-from-here=`{behavior}` は behavior ですが、ここからは呼べません。
behavior.what-reaches-a-behavior=ヘルパ `let` からは behavior を呼べません。また `>->` 合成は呼ぶものではなく合成するものです。`{behavior}` は behavior 自身の `let` から呼んで、結果を渡してください。
check.construct.position.title=ここに構築は書けません
data.a-construction-cannot-be-written-here=`{data}` は型なので `{data}(...)` はその構築ですが、ここに構築は書けません。
check.apply.notfunction.title=関数ではありません
name.it-is-not-a-function-here=`{name}` はここでは関数ではないので、引数に適用できません。
name.write-it-on-its-own=`{name}` とだけ書いてください。
name.a-binding-in-scope-hides-it=適用した場所では `{binding}` という名前の束縛が有効なので、そこでは `{hidden}` は隠れています。
name.a-name-the-language-gives-is-not-a-function=`{name}` は言語が与える名前であって関数ではないので、引数に適用できません。
name.write-a-standard-library-name-qualified=`{name}` は標準ライブラリの名前です。修飾名 ({qualified}) で書くか、使いたい名前を import してください。

# stdlib 引数型チェック（期待するコンテナ種別は訳文フレーズ）
kind.list=List
kind.map=Map
kind.set=Set
kind.option=Option
kind.ordered.list=順序を持つ値（Int, String, Decimal, Rational, Date, Time, DateTime, Instant と、それらの newtype、および全ケースが単位 data の直和＝宣言順で並ぶ列挙）のリスト
kind.numeric.list=Int、Decimal、Rational のリスト
declaration.it-expects-another-type=`{what}` は {expects} を必要としますが、{got} が渡されました。
declaration.it-needs-an-ordered-element=`{call}` は {needs} を必要としますが、要素は {element} です。
type.map-to-an-ordered-field-first=先に順序を持つフィールドに map してから、それを並べ替え／比較してください。
type.the-key-must-be-an-ordered-value=`{call}` のキーは順序を持つ値でなければなりませんが、{returns} を返しています。
declaration.it-needs-a-numeric-element=`{call}` は {needs} を必要としますが、要素は {element} です。
type.map-to-the-numeric-field-first=先に数値のフィールドに map してから、それに `{call}` を適用してください。Int や Decimal の newtype は数値の要素ではありません。演算も、始まりの値も、自分では宣言していないからです。
type.over-the-empty-list-the-seed-decides=空リストに対する `{call}` は初期値を返しますが、それが Int か Decimal か Rational かは要素で決まり、空リストには要素がありません。
type.annotate-the-position-the-call-feeds=呼び出しが流れ込む位置に型注釈を付けてください。束縛（`let total: Decimal = ...`）、フィールド、宣言された出力のいずれかです。
type.it-answers-a-number-and-this-position-needs-another=`{call}` が返すのは Int か Decimal か Rational ですが、この位置が必要としているのは {needed} です。
type.a-newtype-is-built-from-the-result=Int や Decimal の newtype は結果そのものではなく、結果から構築するものです（`Hours({call}(xs))`）。それ以外の型では、この位置に `{call}` は置けません。

# 重複
check.duplicate.title=重複した定義
data.a-let-is-already-defined=`let {name}` は既に定義されています。
data.a-data-is-already-defined=data `{data}` は既に定義されています。
data.a-data-takes-the-standard-library-qualifier=data `{data}` は標準ライブラリの修飾子 `{data}` に予約された名前です（`{data}.\u2026` のように使います）。ライブラリを指す方法は修飾子しかないので、同名の data はそれを覆い隠します。別の名前にしてください。
data.a-let-and-a-data-share-one-spelling=`let {name}` と data `{name}` は、値を書く位置では同じ1つの名前です。data は値として書かれます（単位 data はそれ自体が値、newtype は包む値に適用、record は名前で構築）。どちらかを改名してください。
data.field-is-declared-more-than-once-in=フィールド `{field}` が `{data}` で二度宣言されています。
data.field-is-defined-more-than-once=フィールド `{field}` が複数回定義されています。
data.name-is-listed-more-than-once=`{name}` が {listedIn} に複数回書かれています。

# match
check.match.title=match のエラー
match.the-subject-is-not-a-sum=`match` には直和型の値が必要ですが、{given} が渡されました。
match.not-a-case-of=`{caseName}` は {subject} のケースではありません。
match.it-is-a-case-of-another-sum=`{caseName}` は `{sum}` のケースなので、この腕は `{sum}` に対する match に書くものです。
match.a-match-in-an-arm-takes-the-arms-after-it=腕の本体に書いた `match` は、外側の match の腕より深く字下げされた `|` をすべて取り込みます。同じ行に続く `|` はすべてこれに当たります。内側の match をブロックに入れる（`-> {{ match ... }}`）か、この腕を外側の腕より深く字下げしないでください。
match.matched-by-more-than-one-case=`{caseName}` が複数のケースで扱われています。
match.an-earlier-arm-answers-for-it=この腕も `{caseName}` に一致します
match.this-arm-names-one-case-twice=この腕には `{caseName}` が2回書かれています。2つめは何も足していません。
match.an-alternative-adds-nothing-to-this-arm=`{alternative}` はこの腕に何も足していません。`{alternative}` に一致する値には `{covering}` もすべて一致します。
match.this-match-has-no-cases=この `match` にはケースがありません。
match.an-option-match-takes-no-or-pattern=Option の match では or パターンを使えません。Some と None を別々のケースにしてください。
match.not-a-case-of-an-optional=`{caseName}` は Option のケースではありません。Some か None を使ってください。
match.the-case-has-no-value-to-open=`{caseName}` は値を持たないので、`{caseName}(...)` で分解できません。
match.not-a-newtype-to-open=`{name}` は newtype ではないので、match のケースで `{name}(...)` と開くことはできません。
match.bind-the-matched-value-instead=一致した値そのものを束縛するなら `| {name} as v` と書きます。
match.the-newtype-wraps-another-type=`{name}` が包むのは `{wraps}` であって `{opened}` ではありません。
match.an-or-pattern-opens-nothing=or パターンは直和型を束縛するため、ケースの値を `(...)` で開くことはできません。

# タプルパターン／フィールドアクセス
type.a-tuple-pattern-needs-a-tuple=タプルパターンにはタプルが必要ですが、{given} が渡されました。
type.the-pattern-binds-another-number-of-names=このパターンは {binds} 個の名前を束縛しますが、タプルの要素は {holds} 個です。
declaration.cannot-read-a-field-on-this-value=この値のフィールド `{field}` は読み取れません。
module.cannot-read-a-field-on-a-sum=`{sum}` のフィールド `{field}` は読み取れません。直和自身はフィールドを持たず、持っているのは各ケースで、どのケースかは開くまで分かりません。`match` で開いて、ケースごとに `{field}` を読んでください。
module.these-cases-have-no-such-field=次のケースは `{field}` フィールドを持ちません: {cases}。
module.every-case-declares-its-own=どのケースにも `{field}` フィールドがありますが、各ケースが別々に宣言しています。直和がフィールドを公開するのは、全ケースがそれを持つ data をスプレッドしているときだけです。

# 引数の数・ブロック・構築
check.arity.title=引数の数が違います
declaration.applied-to-another-number-of-arguments=`{what}` は引数を {takes} 個取りますが、{got} 個渡されました。
check.block.title=関数の引数の型を決めるものがありません
name.nothing-says-what-this-function-takes=この関数の引数の型が書かれていません。宣言が型を与える位置に書くか、この関数を束縛する `let` に型注釈を付けてください。
check.construct.title=構築できません
data.data-cannot-be-constructed=data `{data}` は構築できません。自分自身の値を必要とし、底に達しません。
data.its-rules-cannot-all-hold=data `{data}` は構築できません。規則がすべて同時には成り立たず、満たす値がありません。
data.nothing-is-left-for-that-position-to-hold=data `{data}` は構築できません。規則を満たす `{at}` の値がありません。
data.no-value-its-rules-allow-is-in-that-range=data `{data}` は構築できません。規則が `{at}` に許す値は、どれも規則が要求する範囲の外にあります。
data.no-value-these-can-all-hold=data `{data}` は構築できません。規則は {at} を同じ値にしていて、それらすべての規則を満たす値がありません。
data.no-values-these-can-all-differ-in=data `{data}` は構築できません。規則は {at} が互いに異なることを要求していますが、すべてを異ならせるだけの値がありません。
data.these-are-held-as-one-value-and-stated-to-differ=data `{data}` は構築できません。規則は {at} を同じ値にしていながら、互いに異なることも要求しています。
data.no-value-these-allow-is-in-the-range-they-share=data `{data}` は構築できません。規則は {at} を同じ値にしていて、規則が許す値はどれも規則が要求する範囲の外にあります。
data.no-value-its-rules-allow-is-within-the-bounds-they-require=data `{data}` は構築できません。規則が `{at}` に許す値は、どれも規則が要求する上下限の外にあります。
data.no-value-these-allow-is-within-the-bounds-they-require=data `{data}` は構築できません。規則は {at} を同じ値にしていて、規則が許す値はどれも規則が要求する上下限の外にあります。
data.a-set-cannot-be-filled-from-its-element=data `{data}` は構築できません。`{at}` は、要素の型が持つ値の種類（多くても {available}）より多くの相異なる値を持つ必要があります。
data.no-size-its-rules-admit=data `{data}` は構築できません。規則を満たす `{at}` のサイズがありません。
data.a-collection-that-cannot-be-empty-has-nothing-to-hold=data `{data}` は構築できません。`{at}` は空にできませんが、要素の型に値がありません。
data.no-case-of-it-has-a-value=data `{data}` は構築できません。どのケースにも値がありません。
data.it-holds-a-type-with-no-value=data `{data}` は構築できません。値のない `{held}` を保持しています。
data.it-would-have-one-if-the-field-could-be-absent=`{field}` が無いこともある（`{field}?`）なら `{data}` の値は存在します。
data.it-would-have-one-if-the-collection-could-be-empty=`{at}` が空になれるなら `{data}` の値は存在します。
data.a-case-that-does-not-hold-it-would-give-it-one=`{data}` を保持しないケースが1つあれば値は存在します。
data.it-cannot-be-constructed-here=ここで `{data}` を構築することはできません。

# `behavior` を実装する `let` は契約に合わせる
check.impl.title=実装の不一致
behavior.an-implementations-return-comes-from-the-behavior=`let {let}` は `behavior {behavior}` の実装なので、戻り値の型は behavior から取られます。宣言しないでください。
behavior.the-implementation-takes-another-number-of-parameters=`let {let}` は引数を {takes} 個取りますが、`behavior {behavior}` の入力は {inputs} 個、注入される引数は {injected} 個です。
behavior.an-implementations-parameters-take-their-types-from-it=`let {let}` は `behavior {behavior}` の実装なので、引数の型は behavior から取られます。`{parameter}` に型注釈を付けないでください。
behavior.an-injected-parameter-is-out-of-order=`let {let}` の引数 `{parameter}` は `{shouldBe}` であるべきです。`depends on` が挙げた名前は宣言順に末尾の引数になります。
behavior.an-ensures-clause-does-not-name-the-answer=`{behavior}` の `ensures` 句は、制約する結果 `value` を使う必要があります。
behavior.an-ensures-clause-does-not-name-a-parameter=`{behavior}` の `ensures` 句は少なくとも1つの引数を使う必要があります。結果だけについての規則は、その data 型に書いてください。
behavior.an-ensures-expression-is-not-bool=`{behavior}` の `ensures` 式は {actual} ではなく Bool である必要があります。
behavior.a-behavior-with-a-clause-has-a-parameter-named-value=`{behavior}` には `ensures` 句があるため、引数を `value` と名付けられません。句の中ではこの名前が結果を表します。
behavior.an-ensures-arm-is-not-an-output-case=`{arm}` は behavior `{behavior}` の出力ケースではありません。
behavior.an-ensures-clause-over-a-sum-names-no-arm=behavior `{behavior}` の出力は直和なので、各 `ensures` 式には、どの出力ケースについての式かを書く必要があります。そうしないと `value` の型が決まりません。
behavior.an-ensures-clause-over-a-single-type-names-an-arm=behavior `{behavior}` の出力型は1つなので、`ensures` 句は出力ケースを付けずに式として書いてください。
behavior.two-ensures-clauses-share-one-name=`{behavior}` の2つの `ensures` 句がどちらも `{name}` と名付けられています。句の名前は behavior 内で重複できません。
behavior.underscore-cannot-name-an-ensures-clause=`_` は `{behavior}` の `ensures` 句の名前にできません。名前を付けるか、名前なしで書いてください。
behavior.a-composition-carries-an-ensures=合成 `{behavior}` には引数リストがなく、句が使える引数がないので、`ensures` 句を付けられません。
behavior.the-ensures-reaches-a-partial-helper=`{behavior}` の `ensures` 句は停止する必要がありますが、partial ヘルパ `{partial}` を呼んでいます（{through}）。
behavior.the-ensures-constructs-a-data=`{behavior}` の `ensures` 句が `{constructs}` を構築しています。句は結果を検査するだけで、何も構築しません。
behavior.the-named-ensures-constructs-a-data=`{behavior}` の `ensures` 句 `{clause}` が `{constructs}` を構築しています。句は結果を検査するだけで、何も構築しません。
behavior.an-ensures-answers-on-every-path=`{behavior}` の `ensures` 句はすべての経路で Bool を返す必要があり、`unreachable` は使えません。

# ヘルパ `let` の宣言規則
check.helper.title=ヘルパの宣言
helper.a-parameter-needs-its-type=ヘルパ `let {helper}` は引数 `{parameter}` に型注釈を付ける必要があります。
helper.a-parameter-is-not-determined-by-the-body=ヘルパ `let {helper}` の引数 `{parameter}` は本体から型が決まりません。型注釈を付けてください。
helper.this-use-names-no-type=この使い方からは型が決まりません
helper.a-parameter-is-only-read-through-a-field=ヘルパ `let {helper}` の引数 `{parameter}` はフィールドを読むのにしか使われておらず、それでは型が決まりません。型注釈を付けてください。
helper.a-field-is-read-off-it-and-that-names-no-type=フィールドを読んでいますが、それでは型が決まりません
helper.a-function-typed-parameter-needs-its-type=ヘルパ `let {helper}` の引数 `{parameter}` は関数として使われています。関数型引数には型注釈が必要です。
helper.the-body-is-not-what-the-helper-declares=ヘルパ `let {helper}` は {declared} を返すと宣言していますが、本体は {body} です。
helper.what-is-written-here-is-not-what-its-position-takes=この位置は {takes} を取りますが、ここに書かれているのは {written} です。
name.a-recursive-helper-must-declare-its-return-type=再帰ヘルパ `let {helper}` は戻り値の型を宣言する必要があります（`let {helper} (...) : <型> = ...`）。再帰を通じて結果を推論できないためです。
name.a-recursive-helper-is-pure=再帰ヘルパ `let {helper}` は純粋であり、注入 behavior `{injected}` を呼べません。作用はこのヘルパを呼ぶ behavior に置いてください。
check.invariant.invalid.title=不正な invariant
invariant.the-invariant-reaches-a-partial-helper=`{data}` の invariant が `partial` ヘルパ `{partial}` を呼んでいます（{through}）。`partial` なヘルパは停止しないことがありますが、invariant は構築時に検査されるので停止する必要があります。
invariant.the-invariant-constructs-a-data=`{data}` の invariant が `{constructs}` を構築していますが、invariant は data を構築できません。構築される値を検査するだけで、別の値を作ってはいけません。
invariant.the-named-clause-constructs-a-data=`{data}` の invariant `{clause}` が `{constructs}` を構築していますが、invariant は data を構築できません。構築される値を検査するだけで、別の値を作ってはいけません。
invariant.the-clause-reaches-that-construction=invariant `{clause}` から、その構築に至ります。
invariant.this-clause-reaches-that-construction=この invariant から、その構築に至ります。
invariant.a-sum-is-never-constructed=`{data}` は直和で、直和は構築されません（`{data}` の値はそのケースのいずれかとして書かれます）。なので、この invariant は構築でも境界でも検査されることがありません。
invariant.write-it-on-a-case-or-on-a-newtype-over-the-sum=対象のケースに規則を書くか、`{data}` を包む newtype に書いてください。newtype は構築されるので、その invariant が検査されます。
invariant.a-unit-data-has-nothing-to-observe=`{data}` は単位 data なので、この invariant が検査するフィールドがなく、拒める値もありません。この句を削除するか、制約の対象となるフィールドを `{data}` に持たせてください。
invariant.underscore-cannot-name-a-clause=`_` は `{data}` の invariant の句の名前にできません。`as` を付けた構築の `else` では名前のない句を `| _ -> ...` で扱うので、`_` という名前の句を名前で扱うことができなくなります。
invariant.name-the-clause-or-leave-it-unnamed=別の名前を付けるか、名前を付けずに書いてください。名前のない句も検査され、`| _ -> ...` で扱われます。
invariant.an-invariant-answers-on-every-path=`{data}` の invariant が `unreachable` を返していますが、invariant はすべての経路で、構築される値が条件を満たすかどうかを返す必要があります。起こらない経路があるなら、それはこの invariant の中ではなく、モデルが作る値の規則として書いてください。
invariant.two-clauses-share-one-name=`{data}` が `{clause}` という名前の invariant の句を二つ宣言しています。`as` を付けた構築（`... as name else ...`）と境界のエラーは句を名前で指すので、二つの句が同じ名前を持つことはできません。
check.data.invalid.title=不正な data 定義
data.a-data-with-an-empty-body=data `{data}` の本体が空です。これは値がひとつだけの型、つまり単位 data であり、単位 data は本体を書かずに宣言します。
data.write-it-as-a-unit-data-or-give-it-fields=`data {data}` と書いて名前だけで構築するか、`{data}` が持つフィールドを与えてください。

# モジュール／exposing
check.module.title=モジュールのエラー
module.exposing-is-type-granular=`exposing` は型単位です。data の `decoder`/`encoder` は data を公開すれば常に public です。`{notThis}` ではなく `{write}` と書いてください。
module.exposing-names-an-imported-name=`exposing` が `{name}` を挙げていますが、これはこのモジュールに import されたもので、ここで定義されていません。`exposing` はモジュール自身の定義を挙げるもので、import 名を再公開しません。
module.exposing-names-something-this-module-does-not-declare=`exposing` が `{name}` を挙げていますが、これはこのモジュールの data でも behavior でもありません。
declaration.it-rests-on-a-behavior-nobody-has-written=`{behavior}` はここで作られ、`{rested}` に依存しています。`{rested}` は depends on を宣言して `let` を持たないので、Souther が実装する側であり、まだ書かれていません。
declaration.write-its-let-or-leave-this-one-unwritten-too=`let {rested}` を書くか、`{behavior}` の `let` も外して両方を待ちの状態にしてください。

# decoder/encoder 境界を越えてはならない型
check.boundary.title=境界の型
type.a-parameter-is-an-anonymous-union=引数 `{parameter}` は無名の直和型 `{type}` です。behavior の引数は単一の名前付き型を指す必要があります。`data ... = {type}` を宣言してその名前を取ってください。
type.a-function-has-no-value-to-compare=関数は比較する値を持たないので、{given} は `==` / `/=` の被演算子になれません。
type.a-set-element-is-compared-and-a-function-is-not=Set は重複を持たない集合で、そのために要素どうしが等しいかを問います。関数は比較する値を持ちません: {given}。
type.a-map-key-is-compared-and-a-function-is-not=Map はキーで値を引くので、キーどうしが等しいかを問います。関数は比較する値を持ちません: {given}。
type.a-parameter-carries-a-function=引数 `{parameter}` は関数を含みます（{type}）。関数は外部表現を持たないので、behavior の入力として境界を越えられません。
type.an-output-carries-a-function=`{behavior}` は関数を出力します（{type}）。関数は外部表現を持たないので、behavior の出力として境界を越えられません。
type.an-output-carries-an-optional=`{behavior}` の出力はオプショナル ({type}) を含みます。
type.a-parameter-carries-an-optional=引数 `{parameter}` はオプショナル ({type}) を含みます。
type.a-model-type-owns-the-absence=そのオプショナルの位置で、値がないことをモデルの型で表してください。data の `?` フィールドに置くか、直和のケースとして名前を付けます。出力そのものがオプショナルなら、その直和は `-> A | Missing` と直接書けます。
type.a-parameter-takes-a-type-the-language-declares=引数 `{parameter}` は `{type}` を取ります。これはこのモデルではなく言語が宣言している型です。
type.an-output-is-a-type-the-language-declares=`{behavior}` は `{type}` を返します。これはこのモデルではなく言語が宣言している型です。
type.a-parameter-carries-a-primitive-with-no-external-form=引数 `{parameter}` は `{type}` を含みます。`{type}` は外部表現を持たないので、behavior の入力として境界を越えられません。
type.an-output-carries-a-primitive-with-no-external-form=`{behavior}` は `{type}` を出力します。`{type}` は外部表現を持たないので、behavior の出力として境界を越えられません。
type.a-field-takes-a-type-the-language-declares=`{field}` は `{type}` から書かれています。これはこのモデルではなく言語が宣言している型です。
type.declare-it-as-a-type-of-the-model=これをモデルの型として宣言し、境界を越える位置ではその型を使ってください。behavior が返すケース、受け取る data、フィールドの型のどれにも使えます。こうするとモデルが公開するものがモデル自身の型になります。
type.a-parameter-is-a-tuple=引数 `{parameter}` はタプルです。タプルは外部表現を持たず境界を越えられないため、behavior の入力は名前付き data でなければなりません。
type.an-output-is-a-tuple=behavior `{behavior}` はタプルを出力します。タプルは境界を越えられないため、behavior の出力は名前付き data かその直和でなければなりません。

# コレクション型に型引数がない
check.typearg.title=型引数がありません
type.a-list-needs-its-element-type=`List` には型引数が必要です（例: `List<Int>`）。
type.a-set-needs-its-element-type=`Set` には型引数が必要です（例: `Set<String>`）。
type.an-option-needs-its-type-argument=`Option` には型引数が必要です。
type.a-map-needs-its-value-type=`Map` には値の型が必要です（例: `Map<String, Int>`）。
type.a-fields-map-cannot-be-keyed-by-that=`{field}` は境界を越えるので、持っている Map のキーを {key} にはできません。
type.a-parameter-map-cannot-be-keyed-by-that=引数 `{parameter}` が持つ Map のキーが {key} で、境界を越えられません。
type.an-output-map-cannot-be-keyed-by-that=`{behavior}` が返す Map のキーが {key} で、境界を越えられません。
type.a-map-is-a-json-object-keyed-by-strings=Map の外部表現は JSON オブジェクトで、そのキーは文字列です。境界を越える Map のキーは、裸の文字列として書き出され読み取られる型でなければなりません。behavior の本体内であれば Map のキーは任意の値でかまいません。

# 比較・算術のオペランド
type.comparison-needs-ordered-values-of-one-type=比較の2つのオペランドは同じ順序型（Int, String, Decimal, Rational, Date, Time, DateTime, Instant、それらの newtype、または1つの列挙）の値でなければなりません。ケース同士が比較できるのは、両方を挙げている直和が1つに定まるときだけです。ここでは {one} と {other} です。
arithmetic.an-operand-is-not-a-number=算術のオペランドは Int、Decimal、Rational のいずれかでなければなりませんが、{operand} です。
arithmetic.two-different-newtypes={left} と {right} は別の newtype なので、算術では組み合わせられません。
arithmetic.convert-one-to-the-others-newtype=同じものを測っているなら、一方をもう一方の newtype に変換してから組み合わせてください。違うものなら、組み合わせられるものがありません。
arithmetic.a-product-changes-dimension={left} と {right} の積はどちらの量でもなく、その次元をこの言語は表現しません。
arithmetic.compute-on-value-and-build-the-product=`.value` で計算し、積が属する newtype を構築してください。
arithmetic.a-quotient-changes-dimension={left} と {right} は種類の違う量なので、その商の単位が決まりません。同じ newtype 同士なら割れます。単位が打ち消し合い、商は単位のない正確な数になります。
arithmetic.compute-on-value-and-build-the-quotient=`.value` で計算してください。商が newtype なら、その結果から構築してください。
arithmetic.a-reciprocal-changes-dimension={value} を {newtype} で割ると逆数になり、そこで変わる次元をこの言語は表現しません。
arithmetic.compute-on-value-and-build-the-reciprocal=`.value` で計算してください。結果が newtype なら、そこから構築してください。
arithmetic.only-a-literal-is-read-as-the-newtype={newtype} として読まれるのは隣に書かれたリテラルだけで、この {value} は書き下されていません。
arithmetic.build-it-where-the-value-comes-from=値の出どころで {newtype} を構築するか、`.value` で計算してください。
arithmetic.a-value-of-another-base={newtype} が包むのは {base} で、この {value} はそれではありません。
arithmetic.what-each-operator-takes-beside-a-newtype=`*` はどちら側でも {base} でスケールします。`/` はスケールになりません。商は正確な値なので {base} から出てしまい、{newtype} として包み直すものが残りません。`+` と `-` が {base} を読むのは書き下したリテラルのときだけです。それ以外は {newtype} を構築するか、`.value` で計算してください。
arithmetic.a-quotient-leaves-the-wrapped-type={newtype} を {base} で割った商は正確な値で、Rational であって {base} ではありません。{newtype} として包み直す {base} が残りません。
arithmetic.compute-on-value-and-state-the-quantisation=`.value` で計算し、正確な商をどう {base} にするかを書いてください。丸めるのか切り捨てるのかはドメインが決めることで、`/` は何も決めません。
arithmetic.a-newtype-with-no-direct-numeric-base=算術を直接使えるのは、包む値が Int か Decimal の newtype だけです。{newtype} が包むのは {wrapped} です。
arithmetic.reach-the-base-with-value=算術が {newtype} の value を自動で取り出すことはありません。`.value` と書いて {wrapped} にしてから、{wrapped} の規則に従ってください。

# 直和の定義
check.sum.title=直和の定義
behavior.unknown-case-in-a-sum=直和 `{sum}` に未知のケース `{caseName}` があります。
behavior.a-case-is-declared-in-another-module=`{caseName}` は `{module}` で宣言されているので、直和 `{sum}` のケースにはできません。
behavior.a-sums-cases-are-declared-with-it=直和のケースはその直和と一緒に宣言します。生成される直和は sealed interface で、それを実装できるのは自分のモジュールだけです。`{caseName}` は境界で消費するか、このモジュールのケースに再表現してください。
behavior.a-sum-contains-itself=直和 `{sum}` が {through} を経由して自分自身を含んでいます。直和のケースはその型が取りうる値なので、ケースが直和自身になることはできません。
behavior.a-built-in-option-case-cannot-be-declared=`{name}` は組み込みの Option ケースなので data 型として宣言できません。
data.spread-is-not-a-product-data=`...{spread}` はスプレッドできません（直積 data ではありません）。
data.a-data-spreads-itself=data `{data}` が {through} を経由して自分自身をスプレッドしています。値はスプレッドしたものすべてのフィールドを持つので、自分自身に戻ってくる data は自分自身でできていることになります。
data.not-a-field-of=`{field}` は `{data}` のフィールドではありません。
data.a-field-expects-another-type=フィールド `{field}` は {expects} を必要としますが、{got} です。
data.spread-is-not-a-data-value=スプレッド `...{spread}` は data の値か、全ケースが同じ data をスプレッドしている直和の値でなければなりません。
data.name-the-union-with-a-declaration=`{union}` はその場に書かれたユニオンなので、ケースが何を共有しているかを宣言しているものがありません。`data` 宣言でユニオンに名前を付ければ、全ケースがスプレッドしている部分をそこからスプレッドできます。
data.spread-of-a-sum-whose-cases-share-nothing=スプレッド `...{spread}` は `{sum}` のケースが共有するフィールドをコピーしますが、共有しているものがありません。全ケースがスプレッドしている data がないためです。`{spread}` を `match` で開いて、ケースをスプレッドしてください。

# パイプライン／予約名／数値
check.pipe.title=パイプライン
behavior.a-stage-after-the-first-takes-one-input=`{stage}` は入力を {takes} 個取るため、`{pipeline}` の `>->` で後続の段にできません。最初以外の段は入力を1つ取ります。インラインで呼ぶか `match` で分岐を開いてください。複数入力を取れるのは最初の段だけです。
behavior.a-boundary-edge-is-not-a-stage=decode/encode は境界の縁であり、パイプラインの段ではありません。`>->` は behavior のみを合成します。
behavior.a-pipeline-composes-with-itself=パイプライン `{pipeline}` が自分自身と合成しています（循環）。
check.reserved.title=予約された名前
name.a-binding-may-not-shadow-a-built-in=`{name}` は組み込みの値なので束縛名に使えません。組み込みを隠してしまいます。別の名前を選んでください。
type.the-pattern-must-be-written-out=`String.matches` のパターンはコンパイル時に文字列として評価できなければなりません。そこで検証するためです。文字列リテラルを書くか、リテラルとトップレベルの `let` で名付けた値を `++` でつないでください。
type.the-pattern-is-not-a-pattern-at=`String.matches` のパターンは `{construct}` のところでパターンになっていません。閉じていないものがあるか、意味のない回数指定やエスケープがあります。
type.the-pattern-ends-before-it-is-whole=`String.matches` のパターンが、開いたものを閉じる前に終わっています。
type.the-pattern-writes-what-no-pattern-has=`String.matches` のパターンが `{construct}` を書いていますが、これはパターン言語にありません。パターンは仕様が定める文法（§string-patterns）で書くもので、この構文はその文法にありません。
type.the-pattern-places-an-anchor-the-string-decides=`String.matches` のパターンが、先頭にあるか末尾にあるかが一致させる文字列によって変わる位置に `^` か `$` を書いています。パターン言語はこれに意味を与えません。文字列全体と一致させるので、両端のアンカーは省けます。
type.the-pattern-writes-half-a-surrogate-pair=`String.matches` のパターンが `{escape}` を書いています。これはサロゲートペアの片割れで、文字ではありません。これを含む `String` はありません。
type.the-pattern-counts-more-than-a-pattern-may=`String.matches` のパターンは回数 `{construct}` を書いていますが、繰り返しの回数は最大 {most} です。これはどの実装もパターンに課す上限です。パターンとしては言語のものですが、どの実装もこれを実行しません。
type.the-pattern-nests-deeper-than-a-pattern-may=`String.matches` のパターンは `{construct}` でグループの入れ子が {most} 段を超えています。これはどの実装もパターンに課す深さです。グループの重なりを減らして書いてください。
type.the-pattern-comes-to-more-states-than-a-pattern-may=パターン `{pattern}` は、繰り返しを1つずつ書き出すと状態数が {most} を超えます。これはどの実装もパターンに課す状態数です。
type.not-a-union-member=`{member}` は直和のメンバーになれません。メンバーになれるのは `match` の腕が名前で指せる型 —— プリミティブか、このモジュールで宣言したか import した data 型です。
type.one-name-for-two-members=1つの直和に `{name}` と書かれる型が2つあります。`{one}` が宣言したものと `{other}` が宣言したものです。
data.a-case-declares-the-discriminator-field=`{caseName}` は `{sum}` のケースで、フィールド `{field}` を宣言しています。これはその直和がフィールドの隣に書く判別子と同じ名前です。
data.a-member-declares-the-discriminator-field=`{member}` は `{behavior}` の出力のメンバーで、フィールド `{field}` を宣言しています。これはそのユニオンがフィールドの隣に書く判別子と同じ名前です。
data.the-tag-and-the-field-want-one-key=タグとフィールドが同じキー `{field}` を取り合い、後に書かれた方だけが残ります。フィールドを改名してください。
type.a-member-is-named-by-its-written-name=match の腕はメンバーを書かれた名前で指し、外部表現の `"type"` も同じ名前を使うので、1つの名前が2つのメンバーを指すことはできません。どちらかをこのモジュールの型として表し直してください。
module.a-member-reaches-the-union-through-a-data=`{data}` の出力にメンバー `{member}` があります。これはこのモジュールが宣言した型ではないので、生成されるケースクラス `{through}` を介して直和に加わりますが、その名前は `data {caseClass}` が既に使っています。
module.a-member-reaches-the-union-through-a-behavior=`{behavior}` の出力にメンバー `{member}` があります。これはこのモジュールが宣言した型ではないので、生成されるケースクラス `{through}` を介して直和に加わりますが、`behavior {caseClass}` を大文字化した名前と同じです。
module.rename-the-member-or-the-type-it-collides-with=このモジュールが宣言していないメンバーは、自分の名前に `Case` を付けた生成クラス `{member}` として直和に加わります。ここでその名前を既に使っている方を改名してください。
module.two-members-join-through-one-case-class=`{one}` と `{other}` はどちらもこのモジュールの直和のメンバーで、どちらも生成されるケースクラス `{caseClass}` を介して加わります。
module.a-member-goes-by-its-own-name-with-case-after-it=メンバーは自分の名前に `Case` を付けた名前で加わるので、同じ綴りの2つの型が、別々の behavior であってもここで両方メンバーになることはできません。どちらかをこのモジュールの型として表し直してください。

# 第一級関数と関数型のヘルパ引数
check.fn.title=関数
helper.the-block-takes-another-number-of-arguments=`{call}` の `{parameter}` に渡されたブロックは引数を {takes} 個取りますが、{written} 個で書かれています。
helper.the-block-answers-another-type=`{call}` の `{parameter}` に渡されたブロックは {must} を返さなければなりませんが、{returns} を返します。
helper.a-value-where-a-function-is-taken=`{call}` の `{parameter}` は関数を必要としますが、`{written}` は値であって関数ではありません。
helper.the-function-goes-to-another-argument=`{call}` の引数 {at} は `{parameter}` で、関数を受け取りません。関数は引数 {functionAt}（`{functionParameter}`）に渡します。
helper.write-the-call-this-way=`{call}({shape})` の順で書いてください。
helper.this-argument-takes-a-function=`{call}` の引数 {at} は `{parameter}` で、関数を受け取ります。名前付き関数かラムダを渡してください。
helper.this-argument-takes-no-function=`{call}` の引数 {at} は `{parameter}` で、関数を受け取りません。ラムダやフィールドゲッターはここに書けません。
helper.the-function-takes-another-number-of-arguments=`{call}` は関数を {called} 個の引数で呼びますが、関数は {takes} 個取ります。
helper.the-function-takes-another-type=`{call}` の要素型 {given} は、{takes} を取る関数に渡せません。
helper.the-step-answers-another-type-than-the-accumulator=`{call}` のステップは {answers} を返しますが、積み上げる accumulator が持つのは {accumulator} です。
helper.this-expects-a-block=`{call}` はブロックを必要とします（例: `{call}((acc, x) -> ..., seed, xs)`）。
helper.the-block-is-written-with-another-number-of-parameters=このブロックは引数を {takes} 個取りますが、{written} 個です。
helper.the-functions-type-cannot-be-read=関数 `{name}` の型を推論できません。型を書く（`let {name}: (Int) -> Bool = ...`）か、このスコープで適用して引数の型を読めるようにしてください。ラムダの中での適用はそのラムダのスコープに属するので、ここでの型推論には使われません。
helper.the-values-function-type-is-not-written=`{name}` はエントリから使われていて関数を持ちますが、その関数型が書かれていません。書いてください（`let {name}: (Int) -> Bool = ...`）。トップレベルの値は書かれた場所で型が決まるので、ほかの場所で `{name}` を適用しても型は付きません。
helper.the-function-is-applied-at-two-types=関数 `{name}` が異なる引数型で適用されています: {one} と {other}。
helper.the-lambda-is-applied-with-another-number-of-arguments=このラムダは引数を {takes} 個取りますが、{applied} 個で適用されています。
helper.the-branches-answer-different-function-types=2つの分岐が異なる関数型を生成します: {one} と {other}。

# 残り
behavior.a-composition-is-already-its-own-implementation=`let {name}` は合成 `behavior {name}` を実装できません。合成は既に自身の実装です。
behavior.the-body-is-not-what-the-behavior-returns=behavior `{behavior}` は {returns} を返しますが、`let` の本体は {body} です。
data.a-tuple-cannot-be-a-field=タプルは data のフィールドにできません（`{data}.{field}`）。タプルは外部表現を持たず decoder/encoder 境界を越えられません。名前付き data を使ってください。
data.a-field-takes-a-method-of-object=`{field}` は `{data}` のフィールドにできません。生成クラスは同名のアクセサでフィールドを読みますが、`{field}()` はすべての JVM の値が既に持つメソッドです。別の名前にしてください。
data.spread-supplies-the-wrong-type=スプレッドは `{field}` を {supplied} として提供しますが、`{type}` は {needed} を必要とします。
match.the-branches-disagree=match の分岐の型が食い違います: {one} と {other}。
name.not-a-standard-library-function=`{name}` は標準ライブラリの関数ではありません。
type.it-expected-one-type-and-got-another={what}: {expected} を期待しましたが、{got} でした。

# モジュールのリンク・import・定数の不変条件
data.the-written-value-violates-the-invariant=`{value}` は invariant に違反しています。
data.the-written-value-violates-the-clause=`{value}` は invariant の句 `{clause}` に違反しています。
data.the-value-breaks-an-invariant-when-it-is-built=`{value}` は、モジュールが組み立てるときに、作るものの invariant に違反します。
module.the-module-is-in-the-reserved-namespace=module `{module}` は予約された `souther` 名前空間にあります。コンパイラは souther.string / souther.list / souther.map / souther.bool を同梱しており、ユーザーのモジュールは予約名を使えません。
module.the-module-takes-the-standard-library-qualifier=module `{module}` は標準ライブラリの修飾子 `{module}` に予約された名前を使っています（`{module}. …` / `import {module} ( … )` のように）。別のモジュール名を選んでください。
module.duplicate-module=モジュール `{module}` が重複しています。
module.a-module-it-needs-is-not-on-the-path=モジュール `{module}` は `{needed}` を必要としていますが、`{needed}` もパス上にありません。
module.add-it-to-this-projects-dependencies=`{module}` は、依存しているモジュールがさらに依存しているものです。このプロジェクトの依存に足してください。
module.it-is-reached-from-here-too=この import からも同じ宣言に至ります。
module.the-module-is-compiled-here-and-on-the-path=モジュール `{module}` はここでコンパイルされ、同時にパス上にもあります。
module.rename-it-or-drop-the-dependency=1つの名前が2つのモジュールを指すことはできません。こちらをリネームするか、`{module}` を提供している依存を外してください。
module.a-module-on-the-path-needs-one-compiled-here=パス上のモジュール `{module}` は `{reached}` を必要としていますが、`{reached}` はここでコンパイルされます。パス上のモジュールは、ここでコンパイルしたクラスが見えないところで動きます。
module.compile-it-here-or-take-the-other-from-the-path=`{module}` もここでコンパイルするか、`{reached}` をここでコンパイルせずにパスから取ってください。
module.the-module-cannot-be-read-back=モジュール `{module}` はクラスパスにありますが、それが公開した内容をこのコンパイラは読めません。
module.it-was-built-by=Souther {by} でビルドされていて、import する側が何を使ってよいかについて、このコンパイラと一致していません。
module.a-class-it-says-it-declares-is-not-on-the-path=`{declaration}` を宣言していると言っていますが、その宣言を載せたクラスがクラスパスにありません。
module.its-metadata-cannot-be-read-here=そのクラスの1つが、このコンパイラの読めないメタデータを載せています。
module.it-declares-another-module=クラスに含まれる宣言は `{named}` のもので、そのクラスが見つかったモジュールのものではありません。
module.what-it-published-is-not-source-this-compiler-parses=公開された内容が、このコンパイラの読めるソースになっていません。
module.an-import-line-of-its-cannot-be-read-here=その `import {from}` は、このコンパイラが読める行ではありません。
module.a-name-it-published-reaches-nothing-here=宣言が使っている名前が、ここでは見つかりません。
module.a-declaration-of-its-cannot-be-read-here=その `{declaration}` は、このコンパイラがそこで読める宣言ではありません。
module.rebuild-it-or-compile-against-what-built-it=`{module}` をこのコンパイラでビルドし直すか、それをビルドしたバージョンでコンパイルしてください。
module.unknown-module=未知のモジュール `{module}` です。
module.the-module-does-not-expose-it=`{name}` は `{module}` から公開されていません。
module.the-module-declares-no-such-name=`{name}` は `{module}` に定義されていません。
module.it-was-built-requiring-what-the-module-does-not-declare=モジュール `{module}` は `{declaredIn}.{name}` を注入されるものとしてビルドされていますが、このコンパイルが読む `{declaredIn}` に `{name}` は定義されていません。
module.it-links-against-what-the-module-does-not-provide=モジュール `{module}` は {kind} `{declaredIn}.{name}` にリンクするものとしてビルドされていますが、このコンパイルが読む `{declaredIn}` に {kind} `{name}` は定義されていません。
module.it-was-built-against-another-linkage=モジュール `{module}` はその時点の {kind} `{declaredIn}.{name}` に対してビルドされていますが、このコンパイルが読む `{declaredIn}` はそれを別の形で提供しています。{fact} はビルド時に `{built}` で、ここでは `{now}` です。
module.it-copied-what-the-module-does-not-provide=モジュール `{module}` は {kind} `{declaredIn}.{name}` の写しを持ってビルドされていますが、このコンパイルが読む `{declaredIn}` は {kind} `{name}` を写しとして提供していません。
module.it-copied-another-constant=モジュール `{module}` は値 `{declaredIn}.{name}` を定数 `{built}` として取り込んでビルドされていますが、このコンパイルが読む `{declaredIn}` ではその定数は `{now}` です。
module.it-copied-another-version=モジュール `{module}` はその時点の {kind} `{declaredIn}.{name}` の写しを持ってビルドされていますが、このコンパイルが読む `{declaredIn}` は別のものを提供しています。{form} が異なります。
module.rebuild-it-against-the-module-this-compilation-reads=`{module}` をこの `{dependency}` に対してビルドし直すか、それをビルドしたときの `{dependency}` でコンパイルしてください。
invariant.nothing-known-here-establishes=ここでの `{data}` の構築は `{unsettled}` に違反する可能性があります。ここで分かっていることからは、それが成り立つと言えません。
invariant.nothing-known-here-establishes-but-does-establish=ここでの `{data}` の構築は `{unsettled}` に違反する可能性があります。ここで分かっていることからは、それが成り立つと言えません。ここで成り立つと分かっているもの: {settled}。
invariant.nothing-known-here-establishes-the-invariant=ここでの `{data}` の構築は invariant に違反する可能性があります。ここで分かっていることからは、それが成り立つと言えません。
invariant.nothing-known-here-establishes-the-invariant-but-does-establish=ここでの `{data}` の構築は invariant に違反する可能性があります。ここで分かっていることからは、それが成り立つと言えません。ここで成り立つと分かっているもの: {settled}。
invariant.guard-it-or-let-a-data-own-the-relation=構築が失敗する入力をこの behavior が受け取るなら、その失敗は業務上のケースです。`guard` でガードするか、`... as name else ...` の形で構築を試みてください。この書き方なら invariant の検査は一度で済みます。そうした入力をモデルが認めないなら、関係は data が持ちます。これらの値を保持する入力の `invariant` として宣言し、持つ data が無ければ作ってください。
invariant.this-clause-is-not-established-here=ここで分かっていることからは、この句が成り立つと言えません。
invariant.this-clause-rejects-this-value=構築しようとしている値はこの句が拒否する値です。
invariant.this-clause-rejects-the-value-on-some-of-the-paths-here=この構築に来る経路の一部では、構築しようとしている値はこの句が拒否する値です。他の経路では別の句が拒否します。
invariant.the-value-is-one-the-invariant-rejects=ここでの `{data}` の構築は `{unsettled}` に違反します。組み立てている値をその句が拒みます。値を直してください。
invariant.the-value-is-one-the-invariant-rejects-unnamed=ここでの `{data}` の構築は invariant に違反します。組み立てている値を invariant が拒みます。値を直してください。
invariant.the-value-is-rejected-on-a-reachable-path=ここでの `{data}` の構築は、通りうる経路で `{unsettled}` に違反します。ここで分かっていることからは、組み立てている値をその句が拒みます。値を直すか、違反するケースがここに来ないように guard を足してください。
invariant.the-value-is-rejected-on-a-reachable-path-unnamed=ここでの `{data}` の構築は、通りうる経路で invariant に違反します。ここで分かっていることからは、組み立てている値を invariant が拒みます。値を直すか、違反するケースがここに来ないように guard を足してください。
import.imported-name-collides-with-a-declaration=import した `{name}` が、このモジュールの同名の定義と衝突しています。
import.rename-or-qualify-the-colliding-name=1つの名前が2つのものを指すことはできません。ローカルの定義をリネームするか、import をやめて import 先をモジュール名で修飾して参照するか、ローカルの定義を削除して import した方を使ってください。
module.the-name-is-imported-from-two-modules=`{name}` を `{one}` と `{other}` の両方から import しています。
module.it-was-already-imported-here=`{name}` はここで `{from}` から import されています。
module.import-at-most-one-and-qualify-the-other=1つの名前が2つの型を指すことはできません。import するのはどちらか一方だけにして、もう一方はモジュール名で修飾して（`{module}.{name}`）、または `import ... as` の別名で参照してください。
module.the-same-name-is-imported-twice-from-one-module=同じモジュールから同じ名前を2回 import しています。2つ目を削除してください。
import.name-is-not-a-standard-library-function=`{name}` は標準ライブラリのモジュール `{module}` の関数ではありません。
injection.an-injected-input-rests-on-what-is-kept=`behavior {behavior}` に `let` がないので実装はモジュールの外に置かれますが、入力の `{kept}` が `exposing` にありません。
injection.an-injected-output-rests-on-what-is-kept=`behavior {behavior}` に `let` がないので実装はモジュールの外に置かれますが、出力の `{kept}` が `exposing` にありません。
injection.the-base-class-is-public-whatever-exposing-says=実装が継承する基底クラスは `exposing` に関わらず public で、実装は `apply` を override するときにこの型を書きます。`{kept}` を `exposing` に加えてください。
module.an-exposed-field-rests-on-what-is-kept=`{exposed}` は公開されていますが、そのフィールド `{field}` の型 `{type}` は公開されていません。
module.an-exposed-input-rests-on-what-is-kept=`{exposed}` は公開されていますが、入力の `{input}` は公開されていません。
module.an-exposed-output-rests-on-what-is-kept=`{exposed}` は公開されていますが、出力の `{output}` は公開されていません。
module.what-reaches-out-may-not-rest-on-what-is-kept=モジュールが公開するものは、公開していないものに依存できません。import する側には `{kept}` を指す名前がなく、そのクラスも使えません。`{kept}` を `exposing` に加えるか、`{exposed}` を `exposing` から外してください。
module.the-alias-is-already-taken=別名 `{alias}` は、このモジュールではすでに `{by}` を指しています。
module.an-alias-is-a-name-nothing-else-answers-to=別名はこのモジュールの中だけでモジュールを呼び替えるものなので、ほかの何にも使われていない名前にしてください。
check.import.title=インポート
module.imported-but-never-used-under-this-name=`{name}` は import されていますが、この名前では一度も使われていません。
module.take-it-off-the-import-list=import リストから外してください。他のモジュールが宣言したものは import しなくても修飾して参照できるので、このリストに名前が載る理由は、下のどこかで修飾せずに書かれていることだけです。
module.no-module-of-that-name=`{module}` というモジュールはないので、`{module}.{name}` は何も指しません。
module.it-is-declared-there-and-not-exposed=`{name}` は `{module}` に定義されていますが、公開されていません。
module.the-module-declares-no-such-qualified-name=`{module}` に `{name}` は定義されていません。
type.a-temporal-takes-a-written-string=`{type}(...)` は書かれた文字列を取ります（例: `Date("2026-07-01")` / `Time("09:00")` / `DateTime("2026-07-01T09:00")` / `Instant("2026-07-01T09:00:00Z")`）。モデルが持つ部分から組み立てるなら `Date.fromParts` / `Time.fromParts` を使ってください。
type.that-is-not-a-temporal-of-that-kind=`{written}` は {type} として読めません。`Date("2026-07-01")` / `Time("09:00")` / `DateTime("2026-07-01T09:00")` / `Instant("2026-07-01T09:00:00Z")` の形で書いてください。
type.an-instant-is-written-in-utc=`{written}` はタイムゾーンのオフセットを持っています。これは `Instant("2026-07-01T00:30:45Z")` と同じ瞬間で、`Instant` はその形で書きます。ソースに書く値は、その値が出力されるときと同じ形で書くからです。境界ではどちらの形も読めます。
type.a-leap-second-is-not-a-moment=`{written}` はうるう秒です。この言語にはうるう秒に当たる瞬間がなく、直前の秒として読むと、テキストとは別の瞬間になってしまいます。
type.a-time-of-day-is-written-to-the-second=`{written}` は秒より細かく、`{type}` は秒の端数を持ちません。秒までで書くか、端数そのものが要るなら `Instant` を使ってください。
data.a-newtype-wraps-one-value=`{newtype}` は値を1つ包みますが、{applied} 個の引数で適用されています。
helper.called-with-another-number-of-arguments=`{call}` は引数を {takes} 個取りますが、{called} 個で呼ばれています。
helper.an-annotation-on-a-function-binding-is-not-a-function-type=束縛 `{binding}` は関数を保持していますが、その型注釈は関数型ではありません。
helper.write-a-function-type-or-leave-the-annotation-off=`(Int) -> Bool` のような関数型を書くか、型注釈を外して、関数の適用のしかたから型が決まるようにしてください。
behavior.a-behavior-capitalizes-onto-a-data=behavior `{behavior}` は先頭が大文字化され JVM クラス `{jvmClass}` になり（spec jvm-behavior）、data `{jvmClass}` と衝突します。クラス名が異なるよう、どちらかをリネームしてください。
behavior.two-behaviors-capitalize-to-one-class=behavior `{one}` と `{other}` はどちらも先頭大文字化で同じ JVM クラス `{jvmClass}` になります（spec jvm-behavior）。クラス名が異なるよう、どちらかをリネームしてください。
behavior.a-union-outputs-interface-collides-with-a-data=`{behavior}` の出力はユニオンなので、sealed interface `{jvmClass}` として生成されます（spec jvm-anonymous-union）が、そのクラス名は `data {jvmClass}` が既に使っています。
behavior.a-union-outputs-interface-collides-with-a-behavior=`{behavior}` の出力はユニオンなので、sealed interface `{jvmClass}` として生成されます（spec jvm-anonymous-union）が、そのクラス名は `behavior {other}` を大文字化した名前と同じです。
behavior.a-union-output-reaches-java-through-that-name=ユニオンを返す behavior の出力は、Java からは behavior 名を大文字化して `Result` を付けた `{jvmClass}` に見えます。ここでその名前を既に使っている方を改名してください。
data.a-tuple-has-no-external-representation=`{data}` は {carries} を含みます。タプルは外部表現を持たないので codec を導出できません。名前付き data を使ってください。
data.no-codec-can-be-derived=`{data}` の codec を導出できません。外部表現を持たない {carries} を含んでいます。
data.a-newtype-may-not-wrap-an-optional=`{newtype}` は `{wraps}?` を包んでいますが、newtype が包むのは1つの値でその外部表現をそのまま受け取るため、値が無いときに何を表すかがありません。
data.wrap-the-value-and-write-the-question-mark-on-the-field=値そのものを包み（`data {newtype} = ...`）、`?` は使う側のフィールドに書いてください。

# --- 束縛パターンで値を開く（match の外） ---
check.open.title=開けません
type.not-a-newtype-to-open-in-a-binding=`{name}` は newtype ではないので、束縛で `{name}(...)` と開くことはできません。
type.a-binding-opens-only-what-every-value-has=束縛は腕が1つなので、その型のどの値も必ず持っているもの（newtype が包む値・タプルの要素・レコードのフィールド）しか開けません。形を持つかどうかが分かれる値は `match` で開いてください。
type.the-pattern-opens-another-type=このパターンは `{opens}` を開きますが、値は `{value}` です。

# --- 構文エラー（レキサ／パーサ） ---
parse.title=構文エラー
parse.a-declaration-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-expression-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.a-pattern-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-example-expected-something-else=ここでは {expected} を期待しましたが、{found} が見つかりました。
parse.an-expression-was-expected=ここには式が必要です。
parse.a-literal-was-expected=ここにはリテラルが必要です。
parse.a-statement-was-expected=ここにはブロックの行が必要です。
parse.a-pattern-was-expected=ここにはパターンが必要です。
parse.a-source-file-starts-with-a-module-declaration=ソースファイルは `module` 宣言から始めます（単一ファイルなら省略できます）。
parse.a-source-is-named-after-something-that-is-not-a-name=このソースには `module` ヘッダがないので `{given}` という名前になりますが、これはモジュールが持てる名前ではありません。`module` ヘッダを書くか、ファイル名の主部が名前になるようにしてください。
parse.a-top-level-definition-starts-with-a-keyword=トップレベルの定義は `data`・`behavior`・`let` のいずれかで始めます。
parse.a-behavior-is-written-with-a-colon-or-an-equals=behavior は引数の前に `:` を書くか（シグネチャ）、`=` を書きます（合成）。
parse.intrinsic-is-a-core-privilege=`intrinsic` はコアの特権です。予約された `souther` 名前空間のモジュールだけが宣言できます。
parse.private-is-a-core-privilege=`private` はコアの特権です。予約された `souther` 名前空間のモジュールだけが宣言できます。
parse.a-type-variable-is-only-allowed-in-the-core=型変数 `{variable}` は core（予約された `souther` 名前空間）でのみ使えます。ユーザーのモデルは有界のままです。
parse.an-optional-is-only-written-on-a-field-or-in-the-core=オプショナル型 `T?` は data のフィールド、または core（予約された `souther` 名前空間）でのみ書けます。ユーザーのモデルはそれ以外の場所でオプショナルを名前で呼びません。
parse.leave-the-type-off-and-the-optional-is-inferred=ヘルパーの戻り型なら、型を書かなければオプショナルのまま推論されます。値がないことがモデルにとって意味を持つなら、0個か1個の要素のリストを返して `List.flatMap` を使ってください。
parse.a-question-mark-follows-a-sum-of-cases=`?` は単一の型をオプショナルにしますが、{cases} ケースの直和に付いています。
parse.unreachable-states-its-reason-as-a-string=`unreachable` は到達しない理由を文字列で書きます。`unreachable "twenty insured years cannot precede the age of thirty"` のように書いてください。
parse.a-block-ends-in-one-expression=ブロックは最後に値となる式を1つ置きますが、このブロックには `let`／`guard` の行しかありません。改行は文の区切りではないので、独立した行に書いた結果式が上の行の続きとして読まれることがあります。
parse.options-wrapped-value-is-bound-positionally=Option の中身は位置で束縛します。`| Some as v` ではなく `| Some v` と書きます。
parse.some-parens-open-a-wrapped-newtype=値そのものを束縛するには `| Some v` と書きます。`Some(...)` は包まれた newtype を開く形で、`| Some({newtype} v)` のように書きます。
parse.a-case-value-is-bound-with-as=ケースの値は `as` で束縛します。`| {caseName} {bound}` ではなく `| {caseName} as {bound}` と書いてください。位置で束縛できる中身を持つのは `Some` だけです。
parse.a-records-fields-are-destructured-directly=レコードのフィールドは直接分解します。`| Some(Type {{ field }})` ではなく `| Some {{ field }}` と書いてください。括弧は newtype を開く形です。
parse.a-newtype-cannot-wrap-a-tuple=newtype は包んだ型の外部表現をそのまま受け取りますが、タプルには外部表現がありません。名前付きの data を包んでください。
parse.a-newtype-cannot-wrap-a-function=newtype は包んだ型の外部表現をそのまま受け取りますが、関数には外部表現がありません。
parse.a-sums-cases-are-declared-named-data=sum のケースは宣言済みの名前付き data への参照なので、総称型がケースになることはありません。data を宣言してその名前を書いてください。
parse.a-field-type-is-not-an-anonymous-union=フィールド `{field}` に匿名 union が書かれていますが、これはフィールドの型を書く形式ではありません。ケースをまとめた `data` を宣言して、その名前をフィールドに書いてください。
parse.an-anonymous-union-is-not-written-inside-another-type=匿名 union は別の型の中には書けません。ケースをまとめた `data` を宣言して、その名前をここに書いてください。
parse.an-optional-is-not-written-inside-another-type=`?` は data フィールド自身の optional を表す記法で、別の型の中には書けません。型として書くなら `Option<T>`、あるいは `?` を保持するフィールドの側に付けてください。
parse.an-example-only-file-starts-with-its-module=example だけのファイルは、その example が属するモジュールから始めます: `examples for <モジュール>`
parse.a-dependency-clause-is-two-words=behavior の依存句は2語です: `depends on <名前>`
parse.a-let-with-no-parameters-is-written-without-parens=`let {name}` は引数を取らないので `()` は書きません。引数リストのある `let` は関数を、無い `let` は値を定義します。
parse.an-example-needs-at-least-one-row=`example` には `|` で始まる行が少なくとも1つ必要です。
parse.a-fake-needs-at-least-one-row=`fake` には `|` で始まる行が少なくとも1つ必要です。
parse.a-row-name-says-nothing=この行の名前は空です。名前を書くか、名前なしで書いてください。
parse.a-type-variable-needs-a-name-after-the-apostrophe=型変数には `'` の後ろに名前が必要です（例: `'a`）。
parse.a-fractional-literal-needs-the-m-suffix=小数リテラルは Decimal です。`m` を付けてください（例: `{literal}m`）。Souther に浮動小数点型はありません。
parse.an-integer-literal-is-outside-int=`{written}` は `Int` の範囲外です。`Int` は -9223372036854775808 から 9223372036854775807 までで、最小値はマイナスを付けて `-9223372036854775808` と書きます。
parse.a-decimal-literal-has-more-digits-than-a-decimal-holds=この小数リテラルは `Decimal` が保持できる桁数を超えています。
parse.a-string-literal-is-not-closed=この文字列リテラルが行末までに閉じられていません。
parse.a-string-literal-holds-half-a-surrogate-pair=この文字列リテラルはサロゲートペアの片割れを含んでいます。これは文字ではありません。`String` は Unicode スカラー値の並びです。
parse.a-string-literal-is-longer-than-a-string-holds=この文字列リテラルは、正規化したあとの長さが `String` の保持できる長さを超えています。
parse.an-escape-is-not-one-the-language-reads=`\\{escaped}` は読めるエスケープではありません。読めるのは `\\n` `\\t` `\\r` `\\"` `\\\\` です。バックスラッシュ自体は `\\\\` と書きます。
parse.an-unexpected-character=予期しない文字 `{character}` です。
parse.a-name-does-not-begin-with-an-underscore=`{written}` は `_` で始まっています。`_` は名前の途中には書けますが、名前の先頭には書けません。`foo_bar` は名前ですが `_foo` は名前ではありません。単独の `_` は値を捨てる記号です。
parse.a-dollar-is-not-written-in-a-name=`$` は名前には書けません。コンパイラが自分で生成する名前の綴りに使う文字です。
tok.name=名前
tok.integer=整数
tok.decimal=小数
tok.string=文字列
tok.typevar=型変数
tok.eof=入力の終わり


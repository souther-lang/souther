declaration.the-right-side-of-a-value-pipe-is-a-call=`|>` の右辺は関数呼び出しか関数名でなければなりません。
declaration.it-nests-deeper-than-is-read=ここは読み取れる深さを超えて入れ子になっています。検査も整形もコンパイルも同じように再帰で下るため、ここで読むのをやめます。名前の付いた部分に分け、それぞれを単独で読めるようにしてください。値なら束縛に、型なら宣言に切り出します。

# --- examples (E1901-E1920) ---
check.example.title=example

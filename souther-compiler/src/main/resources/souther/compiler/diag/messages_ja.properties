generated-rows.no-row-for-the=`{behavior}` の {what} のテストケースはない: {said}
generated-rows.nothing-offers-a-row-for=`{behavior}` の {what} のテストケースを出すものがない: {why}
generated-rows.nothing-aims-a-row-at=`{behavior}` の {what} をねらうテストケースを出すものがない: {why}
generated-rows.no-row-offered-answered-elsewhere=`{behavior}` の {what} にはテストケースを出さない: この線はほかのテストケースが答えている
generated-rows.no-rows-offered-at-a-withheld-position=`{axis}` ではテストケースを出さない: そこでのテストケースの値を読めなかったので、そのために書くテストケースはすでにここにあるものかもしれない
generated-rows.stopped-one-class-or-arm-past-the-limit=`{behavior}` の生成を止めた: テストケースの上限を超えたクラスか分岐が 1 個ある
generated-rows.stopped-classes-and-arms-past-the-limit=`{behavior}` の生成を止めた: テストケースの上限を超えたクラスと分岐が {count} 個ある
generated-rows.one-group-was-not-looked-in=`{behavior}` の判定のグループ 1 個の組み合わせは調べなかった: どれも、ここでたどる数より多くの組み合わせを持つ
generated-rows.groups-were-not-looked-in=`{behavior}` の判定のグループ {count} 個の組み合わせは調べなかった: どれも、ここでたどる数より多くの組み合わせを持つ
generated-rows.stopped-with-nothing-to-build-against=`{behavior}` の生成を止めた: 候補を構築する元になるものがなかった
generated-rows.stopped-as-the-classes-would-not-link=`{behavior}` の生成を止めた: 生成したクラスをリンクできなかったので、候補を構築するデコーダに届かなかった
generated-rows.rows-offered-were-not-run=`{behavior}` に出したテストケースは実行していないので、それぞれがどの組み合わせに届くかは観測ではなく本体から読んだもの
generated-rows.stopped-as-rows-were-not-read=`{behavior}` の生成を止めた: {why}
generated-rows.the-guard-at={at} のガード
generated-rows.the-guard-at-looking-for={at} のガード（{labels} を探していた）
generated-rows.looking-for-with={first} と {rest}
generated-rows.way-past-it=そこを越える道 {way}: {came}
generated-rows.no-row-was-found-that-goes-past={guard}を越えるテストケースは見つからなかった — {ways}
generated-rows.its-condition-never-comes-out-that-way={guard}: その条件はブロックが続く側には出ないので、そこを越えるテストケースはない
generated-rows.the-ways-past-it-could-not-be-read={guard}: そこを越える道を本体から読めなかったので、何も探さなかった — それでテストケースが越えられないガードになるわけではない
generated-rows.nothing-looks-past-one-guard-twice={guard}: 一度はテストケースにそこを越えさせたが、先へ進めたテストケースがまたそこで止まった。1つのガードを2回は越えようとしない
generated-rows.nothing-was-looked-for=何も探さなかった。それでテストケースが通らない道になるわけではない
generated-rows.nothing-holds-a-row-to-it=ここではテストケースをそこに沿わせるものがないので探さなかった — それでテストケースが通らない道になるわけではない
generated-rows.so-no-row-goes-this-way={noValue}ので、この道を通るテストケースはない
generated-rows.it-would-rewrite-a-stated-value=この道を通るテストケースは、モジュールが述べる値を書き直すことになる。テストケースはそれを書いたまま保つので、探さなかった
generated-rows.the-row-already-does-all-of-it=テストケースはそのすべてを行ったのに止まったので、本体から読んだ道がすべての道というわけではない
generated-rows.the-rule-at=`{at}` の {rule}
generated-rows.what-the-rules-about-it-leave=`{at}` についての規則が合わせて残すもの
generated-rows.composing-a-value-for=`{at}` の値の組み立て
generated-rows.gave-nothing={subject}は{why}
generated-rows.gave-none-as-unread=どの値も出さなかった: {why}
generated-rows.gave-none-for-a-larger-machine=どの値も出さなかった: 値を求めるのに、許される大きさを超える機械が要る
generated-rows.gave-none-having-spent-the-composing=どの値も出さなかった: 値を求めるのに、テストケース1つの組み立てに使える分を使い切った
generated-rows.gave-none-having-spent-the-pattern=どの値も出さなかった: 機械を作るのに、パターン1つを作るのに使える分を使い切った
generated-rows.nothing-could-build-a-representative=ここではその代表を何も構築できなかった。それで書けないことにはならない
generated-rows.every-value-tried-was-refused=試した値はすべて構築で拒否された。それでその組み合わせがありえないことにはならない
generated-rows.every-value-tried-was-refused-of-some=試した値はすべて構築で拒否されたが、渡した値ですべてを尽くしたとは示されていない
generated-rows.nothing-could-answer-for-a-dependency=対象が依存する behavior の代わりに答えるものがここにはなく、代わりを置かないテストケースは何も適用しないテストケースになる
generated-rows.a-table-is-what-this-needs=対象が依存する behavior が、適用されたものに応じて答える必要がある。それはテストケースの1行ではなく、モジュールに書く表になる
generated-rows.the-search-left-something-untried=探索は試していないものを残した
generated-rows.the-group-was-not-offered=それを決める判定は合わせると、ここでテストケースを出す数より多くの組み合わせになるので、どれも調べなかった
generated-rows.no-row-composed-was-seen-reaching-it=そのために組み立てたテストケースがそこに届くのを見なかった。それで届かないことにはならない
generated-rows.the-way-in-places-at-no-class=そこへの道には、どの位置のどのクラスにもあたらない判定があるので、ここではテストケースをその道に沿わせられない
generated-rows.the-block-is-as-long-as-it-may-be=その値は見つかったが、このブロックは出せるだけのテストケースをすでに出している
generated-rows.it-would-need-one-position-to-be-two-things=1つの位置が同時に2つのものであることを求めるので、{noValue}。書くテストケースはない
generated-rows.it-is-past-a-condition-that-never-comes-out-so=どのテストケースでも逆に出る条件の先にあるので、{noValue}。書くテストケースはない
generated-rows.the-modules-classes-were-not-there=候補を構築する元になるモジュールのクラスがなかった
generated-rows.this-build-composed-no-values=このビルドは値を組み立てなかったので、そこでは何も試さなかった
generated-rows.the-generated-classes-would-not-link=生成したクラスをリンクできなかったので、候補を構築するデコーダに届かなかった
generated-rows.the-position-was-withheld=その位置でのテストケースの値を読めなかったので、そのクラスを探さなかった — そのために書くテストケースはすでにここにあるものかもしれない
generated-rows.the-rows-were-not-read=テストケースを読まなかったので、何も探さなかった。読めなかった理由は上に書いた
generated-rows.no-candidate-was-offered=そこに置けるものを走査しても値が1つも出てこなかったので、何も構築せず、何も拒否していない
generated-rows.no-reading-of-the-line-could-be-searched=ここで問うた線のどの読みも探索できなかったので、そこでは何も探さなかった — そこにテストケースがあるかどうかについては何も言っていない
generated-rows.every-row-composed-reaches-an-unreachable=そのために組み立てたテストケースはどれも本体が述べる `unreachable` に届き、コンパイラはそれを拒否する

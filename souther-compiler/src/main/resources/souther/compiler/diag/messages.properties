check.list.msg=The elements of this list do not all have the same type.
check.list.hint=One element is {0} and another is {1}; make every element the same type.

# a local binding's type annotation (`let x: T = e`)
check.let.annotation=The binding `{0}` declares {1}, but its value is {2}.

# a fold over an empty-collection seed whose accumulator type cannot be inferred from context
check.fold.seed.title=CANNOT INFER TYPE
check.fold.seed.untyped=This empty collection''s element type cannot be inferred here. Annotate the binding it feeds (`let x: <type> = ...`), place the fold directly in a typed position — the field or behavior output it feeds — or seed it with a non-empty value.
check.fold.seed.here=the accumulator''s type stays unknown, so this operation has nothing to work on

# binary / unary operand types
check.concat.msg=`++` joins two lists or two strings, but the operands are {0} and {1}.
check.compare.msg=These two values cannot be compared: {0} and {1}.
check.neg.msg=Unary minus needs an Int or a Decimal, but this is {0}.
check.operand=this is {0}

# behavior composition type mismatch (E1701)
e1701.msg=These behaviors cannot be composed: the left behavior''s output is not accepted by the right behavior''s input.
e1701.hint=Make the left output a case the right behavior accepts, or handle the extra cases before this stage.

# --- coded declaration errors ---

# construction authority (E1002 too few, E1006 too many)
e1002.msg=Behavior `{0}` constructs `{1}` but does not declare `constructs {1}`.
e1002.hint=Add `constructs {1}` to `{0}`, or stop constructing {1} here.
e1006.msg=Behavior `{0}` declares `constructs {1}` but never builds {1}; it passes an existing value through.
e1006.hint=Remove `{1}` from the `constructs` clause.

# depends on (E1602 missing, E1603 extra)
e1602.msg=`let {0}` calls `{1}`, which has no implementation, but `behavior {2}` does not declare `depends on {1}`.
e1602.hint=Add `depends on {1}` to `behavior {2}`.
e1603.msg=`behavior {0}` declares `depends on {1}`, but `let {2}` never calls it.
e1603.hint=Remove `{1}` from the `depends on` clause.

# `null` written as a name (E1301)
e1301.msg=`null` is not part of the language. Use an optional field with `?`.

# a cycle among the modules being compiled (E1501)
e1501.msg=Cyclic module dependency detected.

# `Some` / `None` written where no `?` field is being given a value (E1303)
e1303.some=`Some(...)` is not a call: a value written into a `?` field is wrapped for you, and that is the only place an optional is made.
e1303.some.hint=Where a `?` field is being given a value, write the value on its own. Elsewhere an optional is only read — a `?` field, `Map.get`, `List.find` — never made.
e1303.none=`None` is the empty value of a `?` field, and nothing here is asking for one.
e1303.none.hint=Where the model owns the absence, make it a case of its own sum. Absence of that kind does not reach `List.filterMap`, whose step has to answer an optional: use `List.flatMap` over a step answering a list of nought or one.

# `unreachable` where the position states no type (E1307)
check.unreachable.untyped=Nothing here says what this position holds, and `unreachable` answers no value to say it with.
check.unreachable.untyped.hint=Write it where the type is stated — an arm beside one that answers a value, a field, a declared return, an annotated binding.

# injected behavior constructs an uncreatable data (E1305)
e1305.msg=Injected behavior `{0}` declares `constructs {1}`, but {1} is neither a unit data nor exposed, so Java cannot build it.
e1305.hint=Expose {1}, or make it a unit data.

# composition output declaration vs inference (E1604) and output signature (E1605)
e1604.msg=behavior {0} declares its output as {1}, but the pipeline produces {2}.
e1604.hint=Update the declared output, or handle the extra case before the output.
e1605.notcomposition=`exposing` gives an output signature to `{0}`, which is not a composition (`>->`); only a composition needs one.
e1605.missing=Exposed composition `{0}` must declare its output in `exposing`.
e1605.missing.hint=Write `exposing ( {0} : {1} )`.

# a `depends on` that does not name an injection target (E1607)
e1607.nothing=`behavior {0}` declares `depends on {1}`, but `{1}` depends on nothing, so there is nothing to inject.
e1607.nothing.hint=Remove `{1}` from `depends on` and call it directly; a behavior that depends on nothing is reached by name.
e1607.unknown=`behavior {0}` declares `depends on {1}`, which is not a behavior in scope with a requirement of its own.
e1607.unknown.hint=Declare `behavior {1}` with no `let` here, or import it from the module that declares it.
e1607.composition=`behavior {0}` declares `depends on {1}`, but `{1}` is a `>->` composition.
e1607.composition.hint=Remove `{1}` from `depends on`. A composition''s requirements are decided by its stages and are not written, so a caller cannot rest on them; compose with it, or depend on what its stages depend on.

# spread field collisions (E1004) and a construction that leaves a field with no value (E1005).
# One rule, and a hint per way of breaking it: which of these the reader gets is decided by what the
# construction was written with, so a source with no spread is never told about one.
e1004.msg=Field `{0}` from `...{1}` conflicts with a field of `{2}`.
e1005.msg=Construction of `{0}` is missing field `{1}`.
e1005.hint.written=Give `{1}` a value: write `{1} = …`, or write `{1}` alone to fill it from a binding of that name.
e1005.hint.spread=Supply `{1}` explicitly; the spread does not provide it.
e1005.hint.sum=`{1}` is not in the part every case of `{2}` spreads, so the spread does not provide it. Supply it explicitly, or open `{2}` with `match` and read it from the case that has it.
e1005.hint.sums=A spread of a sum provides the part every case of it spreads, and `{1}` is in that part of none of these: {2}. Supply it explicitly, or open the sum whose case has it with `match`.

# invariant type (E1101)
e1101.msg=An invariant expression must have type Bool, but this is {0}.

# arbitrary Java call (E1401) and stdlib qualifier
e1401.msg=`{0}` is not a behavior or a builtin.
e1401.hint=Declare a behavior without a `let` and implement it from Java; arbitrary JVM calls are not allowed.
check.behavior.notcallablehere=`{0}` is a behavior, and it cannot be called from here.
check.behavior.notcallablehere.hint=A helper `let` does not reach a behavior, and a `>->` composition is composed with rather than called. Call `{0}` from a behavior''s own `let` and pass the result in.
check.construct.position.title=CONSTRUCTION NOT ALLOWED HERE
check.construct.position=`{0}` is a type, so `{0}(...)` constructs one, and a construction cannot be written here.
check.apply.notfunction.title=NOT A FUNCTION
check.apply.notfunction=`{0}` is not a function here, so it cannot be applied to arguments.
check.stdlib.value.hint=Write `{0}` on its own.
check.builtin.notfunction=`{0}` is a name the language gives, not a function, so it cannot be applied to arguments.
check.stdlib.qualified.msg=`{0}` is a standard-library name. Write it qualified ({1}) or import the name you mean.


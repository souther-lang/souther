# Diagnostic message catalog — English base.
# A key missing from another catalog falls back here. That is a fail-safe: every catalog that
# ships defines every key this one defines, and the build holds it to that.
# Codes are the stable identity; titles/messages/hints are prose and may be localized.
# A key names the same {0}-style arguments in every catalog — the site passes one argument list
# and does not know which language will render it. Order is a translation's business.
# Every value is a MessageFormat pattern, whether or not it takes arguments: write a literal
# brace as '{' and a literal apostrophe as ''.

# --- frame ---
diag.error.title=ERROR
diag.warning.title=WARNING
diag.hint.label=Hint:
diag.diff.found=It is:
diag.diff.expected=But it needs to be:
diag.suggestion=did you mean `{0}`?

# --- what the command line says about the build, rather than about the source ---
cli.warnings.refused=No classes were written: warnings are treated as errors.
cli.examples.strict.refused={0} gap(s) named above: the rows do not cover the model.
cli.examples.selector.module=no module named `{0}`. These sources declare: {1}.
cli.examples.selector.behavior=no behavior named `{0}`. These sources declare: {1}.
cli.examples.selector.behavior.none=no behavior named `{0}`. These sources declare no behavior at all.
cli.examples.selector.pair=`{0}` declares no behavior named `{1}`. It declares: {2}.
cli.examples.selector.pair.none=`{0}` declares no behavior named `{1}`. It declares no behavior at all.


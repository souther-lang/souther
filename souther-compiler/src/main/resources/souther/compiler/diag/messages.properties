check.equality.function=A function has no value to compare, so {0} cannot be an operand of `==` or `/=`.
check.set.function=A Set has no duplicate elements, which asks whether two are equal, and a function has no value to compare: {0}.
check.map.key.function=A Map finds a value by its key, which asks whether two keys are equal, and a function has no value to compare: {0}.
check.param.function=Parameter `{0}` carries a function ({1}); a function has no external representation, so it cannot cross the boundary into a behavior.
check.output.function=`{0}` outputs a function ({1}); a function has no external representation, so it cannot cross the boundary out of a behavior.
check.output.optional=The output of `{0}` carries an optional ({1}).
check.param.optional=Parameter `{0}` carries an optional ({1}).
check.optional.hint=A model type has to own the absence where the optional stands: put it on a `?` field of a data, or name it as a case of a sum. Where the whole output is the optional, that sum is written directly — `-> A | Missing`.

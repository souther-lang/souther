dead-branch.this-arm-is-taken-on-the-way-here=this arm has to be taken to get here
dead-branch.this-has-to-answer-on-the-way-here=this has to give a value without aborting (for example, without overflowing) to get here
dead-branch.this-call-made-the-copy-the-proof-is-about=the marks inside `{called}` are about this call of it
dead-branch.the-position-stops-short-of-it=`{position}` can only be {admits}, and this branch is for values outside that.
dead-branch.every-case-it-is-written-for-is-refused=The model's rules never let `{position}` be {cases} here, so this branch never gets a value.
dead-branch.the-value-matched-on-is-never-its-case=The value matched here is written in the source as {canBe}, and this arm is for {cases}, so it never matches.
dead-branch.every-way-in-is-ruled-out=There is more than one way to get here, and none of them can happen:
dead-branch.its-closure-is-applied-to-nothing=This is inside a function applied to each element of {containers}, and on every way here they are empty, so the function is never called.
dead-branch.its-declaration-holds-none-of-the-cases=`{position}` is declared as {declared}, and this arm is for {cases}, so it never matches.
dead-branch.its-declaration-holds-nothing-the-arms-before-leave=`{position}` is declared as {declared}, and the arms before this one already match {cases}, so no value is left for this one.
dead-branch.no-run-gets-past-one-of-its-applications=A call on the way here applies a function to every element it is given, and applying it to the element at index {index} (counting from 0) never gives a value, because:
dead-branch.this-applies-a-function-to-every-element=this applies a function to every element
dead-branch.take-it-out-or-let-something-reach-it=Remove the branch, or widen what reaches it. The branch itself is not what rules it out.
dead-branch.build-the-value-rather-than-attempt-it=The invariant clauses this `else` handles are always true here, so the construction never fails. Build the value directly instead of attempting it with `as`.
dead-branch.answer-the-departure-with-unreachable=The invariant clauses this arm handles are always true here, so the arm is never taken, though another arm of the `else` can be. Every clause needs its arm, so keep this one and write `unreachable` as its value.
dead-branch.answer-the-departure-rather-than-attempt-it=The invariant clauses of this value cannot all be true here, so the construction always fails and its success branch never runs. Write what the `else` gives directly instead of attempting the construction.


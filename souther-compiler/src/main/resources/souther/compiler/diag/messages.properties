# --- a branch the model's own rules make dead (E1327) ---
check.dead.branch.title=BRANCH NOTHING REACHES
# What a position can be, dropped into the sentence about a branch outside it. Filled by position:
# the values as the model writes them, or the range in the notation a generated row's name uses.

check.invariant.invalid.title=INVALID INVARIANT
check.invariant.partial=The invariant of `{0}` reaches the `partial` helper `{1}` ({2}), which carries no termination guarantee; an invariant is checked at construction time and must terminate.
check.invariant.construct=The invariant of `{0}` constructs `{1}`, but an invariant may not construct a data — it observes the value being built, it does not build another.
check.invariant.construct.named=The invariant `{2}` of `{0}` constructs `{1}`, but an invariant may not construct a data — it observes the value being built, it does not build another.
check.invariant.construct.here=The invariant `{0}` reaches that construction.
check.invariant.construct.here.unnamed=This invariant reaches that construction.
check.invariant.onunit=`{0}` is a unit data, so it has no field for this invariant to observe and nothing it could reject. Drop the clause, or give `{0}` the field the constraint is about.
check.invariant.underscore=`_` cannot name an invariant clause of `{0}`. An attempt writes `| _ -> ...` for the clauses that carry no name, so a clause named `_` could never be answered by name.
